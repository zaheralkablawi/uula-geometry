<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UULA Geometry</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
/*FONT*/
:root{--bg:#f3f5f8;--panel:#fff;--fg:#18212e;--muted:#5d6878;--line:#d9dfe7;--accent:#1f71de;--soft:#e7effc;--danger:#b8372b;--ok:#1d7a4f}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:14px "UULA Sans",-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.45}
button,input,select{font-family:inherit;color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:8px 10px 12px;display:flex;flex-direction:column;gap:8px}
header{display:flex;align-items:center;gap:6px;position:relative}
header h1{margin:0;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
header h1 svg.logo{width:30px;height:30px;flex:none}
header .bt{display:flex;flex-direction:column;justify-content:center;line-height:15px}
header .root{color:#1f71de;font-size:14px;font-weight:600;letter-spacing:.03em}
header .sub{color:#9aa3b0;font-size:13px;font-weight:500}
header .bt .root:only-child{color:var(--fg);font-size:15px;letter-spacing:0}
.ib{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--fg);position:relative;padding:0;cursor:pointer;flex:none}
.ib:hover{border-color:var(--accent)}
.ib:disabled{opacity:.45;cursor:default}
.hsp{flex:1}
.updbtn .dot{position:absolute;top:3px;left:3px;width:7px;height:7px;border-radius:50%;background:#e5322d}
.appmenu{position:static}
.menu{position:absolute;top:34px;left:0!important;right:auto!important;z-index:60;min-width:190px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:4px;display:flex;flex-direction:column}
.menu button{border:0;background:none;text-align:start;padding:6px 9px;border-radius:5px;font-size:12px;cursor:pointer}
.menu button:hover{background:var(--bg)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{flex:1;height:28px;border:0;background:none;font-size:12.5px;cursor:pointer;white-space:nowrap;padding:0 5px}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.gal{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
#galP{grid-template-columns:repeat(9,1fr)}
.gal button{height:34px;border:1px solid var(--line);border-radius:7px;background:#fff;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.gal button:hover{border-color:var(--accent)}
.gal button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt{display:flex;align-items:center;gap:6px}
.opt>.label{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.opt .seg{flex:1}
.opt .seg button{font-size:11.5px;height:26px;flex:auto;padding:0 4px}
.opt .seg{min-width:0}
.pv{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;padding-bottom:36px}
#fig{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
#fig .hs{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
#fig .hs:hover{stroke:rgba(31,113,222,.18)}
#fig .hs.sel{stroke:rgba(31,113,222,.28)}
#fig .hb{fill:transparent;cursor:move}
#fig .hv{fill:transparent;pointer-events:all;stroke:#1f71de;stroke-width:1.6;cursor:grab}
#fig .hv.sel{stroke-width:3}
#fig .hp{stroke-dasharray:2 2;cursor:pointer}
#fig .hc{fill:none;stroke:transparent;stroke-width:12;cursor:ew-resize}
.ins{position:absolute;left:6px;bottom:6px;height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:#fff;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;cursor:pointer}
.ins:hover{filter:brightness(1.08)}
.ins:disabled{opacity:.5;cursor:default}
.pvt{position:absolute;right:6px;bottom:6px;display:flex;gap:4px}
.pvt .ib{width:26px;height:26px}
.edbar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--soft);border:1px solid #bcd3f5;border-radius:8px;padding:4px 8px;font-size:12px;color:var(--accent)}
.edbar button{border:1px solid var(--line);background:#fff;border-radius:6px;font-size:12px;height:24px;padding:0 8px;cursor:pointer}
#msg{unicode-bidi:plaintext;font-size:12.8px;color:var(--muted);text-align:center;min-height:0}
#msg:empty{display:none}
#msg.bad{color:var(--danger)}#msg.good{color:var(--ok)}
.pop{position:relative;background:#fff;border:1px solid #bcd3f5;border-radius:10px;box-shadow:0 2px 8px rgba(31,113,222,.12);padding:8px;display:flex;flex-direction:column;gap:6px;font-size:12px;width:auto!important}
.pop .r input{max-width:150px!important}
.pop .angico{display:inline-flex;align-items:center;gap:3px}
.pop .ph{font-weight:600;color:var(--muted);font-size:11.5px;display:flex;justify-content:space-between;align-items:center}
.pop .ph button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:13px;padding:0 2px}
.pop .r{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pop input{flex:1;min-width:0;height:26px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;padding:0 6px;text-align:center}
.pop input:focus{outline:none;border-color:var(--accent)}
.q{width:26px;height:26px;border:1px solid var(--line);border-radius:6px;background:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer;position:relative;flex:none}
.q:hover{border-color:var(--accent)}
.q[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.q .cbar{position:absolute;left:5px;right:5px;bottom:3px;height:3px;border-radius:2px;border:1px solid rgba(0,0,0,.12)}
.q.none .cbar{background:linear-gradient(135deg,#fff 40%,#e05a4f 40%,#e05a4f 60%,#fff 60%)!important}
.q b{font-size:12px;font-weight:600}
.sec{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:7px}
.sec>.label{font-size:12px;font-weight:600;color:var(--muted)}
.note{font-size:11.8px;color:var(--muted);unicode-bidi:plaintext}
.sel{direction:ltr}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{height:26px;padding:0 9px;border:1px solid var(--line);border-radius:13px;background:#fff;font-size:12px;display:inline-flex;align-items:center;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.dims{display:flex;flex-wrap:wrap;gap:6px}
.dims label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.dims input{width:64px;height:26px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;padding:0 6px;text-align:center}
.sty{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.sty .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
.sel{height:26px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:12px;padding:0 2px;cursor:pointer;max-width:62px}
footer{text-align:center;font-size:11.5px;color:var(--muted);direction:ltr}
#pal{position:fixed;z-index:80;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:7px;width:232px}
#pal .clab{font-size:12px;color:var(--muted);font-weight:600;margin:2px 0 4px}
#pal .row{display:grid;grid-template-columns:repeat(10,18px);gap:3px;direction:ltr}
#pal .sw{width:18px;height:18px;border:1px solid rgba(0,0,0,.15);padding:0;cursor:pointer}
#pal .sw:hover{outline:2px solid var(--accent);outline-offset:1px}
#pal .mine{display:flex;gap:6px;margin-bottom:6px;direction:ltr}
#pal .mine .sw{width:22px;height:22px;border-radius:5px}
#pal .gap{height:5px}
#pal .more,#pal .nonec{margin-top:6px;width:100%;height:26px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:12px;cursor:pointer}
#pal .nonec{margin:0 0 6px}
#palCustom{position:absolute;width:0;height:0;opacity:0;border:0;padding:0}
.modal{position:fixed;inset:0;background:rgba(15,20,30,.35);display:flex;align-items:center;justify-content:center;z-index:90;padding:16px}
.mbox{background:#fff;border-radius:10px;padding:14px;max-width:320px;width:100%;font-size:13px;line-height:1.7}
.mbox h3{margin:0 0 6px;font-size:14px}
.mbox .mclose{margin-top:8px;height:28px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 12px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <h1 dir="ltr"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12.5" fill="none" stroke="#1f71de" stroke-width="2.6"/><path d="M16 8.6L23.4 21.6H8.6z" fill="none" stroke="#1f71de" stroke-width="2.3" stroke-linejoin="round"/></svg><span class="bt"><span class="root">UULA</span><span class="sub">Geometry</span></span></h1>
    
    <span class="hsp"></span>
    <button type="button" class="ib updbtn" id="updBtn" hidden data-ti="upd" title="تحديث جديد" aria-label="تحديث جديد"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10a6 6 0 1 1-1.8-4.3"/><path d="M16.2 3.2v3.5h-3.5"/></svg><span class="dot"></span></button>
    <div class="appmenu" id="menuWrap">
      <button type="button" class="ib" id="menuBtn" aria-haspopup="true" aria-expanded="false" data-ti="menu" title="القائمة" aria-label="القائمة"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 6h12M4 10h12M4 14h12"/></svg></button>
      <div class="menu" id="appMenu" role="menu" hidden>
        <button type="button" role="menuitem" id="loadSelItem" data-act="edit" data-i="loadSel">تعديل الشكل المحدد</button>
        <button type="button" role="menuitem" id="fromPicItem" data-act="pic" data-i="fromPic">تحويل الصورة المحددة إلى شكل</button>
        <button type="button" role="menuitem" id="chkUpd" data-i="chkUpd">التحقق من التحديثات</button>
        <button type="button" role="menuitem" id="langItem">English</button>
        <button type="button" role="menuitem" id="aboutBtn" data-i="about">حول الأداة</button>
      </div>
    </div>
  </header>

  <div class="seg" id="tabs" role="tablist">
    <button type="button" data-tab="p" data-i="tabP">مستوية</button><button type="button" data-tab="c" data-i="tabC">الدائرة</button><button type="button" data-tab="s" data-i="tabS">مجسمات</button>
  </div>

  <div class="gal" id="galP"></div>
  <div class="gal" id="galS"></div>

  <div class="opt" id="optTri"><span class="label" data-i="type">النوع</span><div class="seg" id="segTri"></div></div>
  <div class="opt" id="optFree"><span class="label" data-i="tools">أدوات</span><div class="seg" id="segFree"></div></div>
  <div class="opt" id="optN"><span class="label" data-i="sides">الأضلاع</span><div class="seg" id="segN"></div></div>
  <div class="opt" id="optHid"><span class="label" data-i="hidden">الأحرف المخفية</span><div class="seg" id="segHid"></div></div>

  <div class="edbar" id="edBar" hidden><span data-i="editing">تعديل شكل محدد</span><button type="button" id="edCancel" data-i="cancel">إلغاء</button></div>

  <div class="pv" id="pv">
    <svg id="fig" viewBox="0 0 320 250" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="pvt">
      <button type="button" class="ib" id="picBtn" data-ti="fromPic" title="تحويل الصورة المحددة إلى شكل"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="4" width="10" height="9" rx="1.5"/><path d="M3 11l3-3 3 3"/><path d="M15 9h3l-1.5-1.5M18 9l-1.5 1.5"/><path d="M14 20l3.5-6 3.5 6z"/></svg></button>
      <button type="button" class="ib" id="undoBtn" data-ti="undo" title="تراجع"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button type="button" class="ib" id="rotBtn" data-ti="rot" title="تدوير"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4.5L15 9l-6 4.5z" transform="rotate(-20 12 9)"/><path d="M5 17a8 8 0 0 0 14 0"/><path d="M19 13v4h-4"/></svg></button>
      <button type="button" class="ib" id="flipBtn" data-ti="flip" title="انعكاس"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3v18M9 7L3 17h6zM15 7l6 10h-6z"/></svg></button>
      <button type="button" class="ib" id="resetBtn" data-ti="reset" title="الشكل الأصلي"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.3-5.7"/><path d="M4 4v5h5"/></svg></button>
      <button type="button" class="ib" id="clearBtn" data-ti="clear" title="مسح الرسم"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg></button>
    </div>
    <button type="button" class="ins" id="insert" data-ti="insert" title="إدراج"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><span id="insTxt" data-i="insert">إدراج</span></button>
  </div>
  <div class="pop" id="pop" hidden></div>
  <div id="msg" role="status"></div>

  <div class="sec">
    <div class="label" id="onLab" data-i="onShape">على الشكل</div>
    <div class="chips" id="chips"></div>
    <div class="dims" id="dims"></div>
    <div class="note" id="hint"></div>
  </div>

  <div class="sec">
    <div class="label" data-i="style">التنسيق</div>
    <div class="sty">
      <button type="button" class="q cbtn" id="cLine" data-k="line" data-ti="cLine" title="لون الخط"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20L20 4"/></svg><span class="cbar"></span></button>
      <select class="sel" id="wSel" data-ti="width" title="سماكة الخط"></select>
      <button type="button" class="q" id="dSolid" data-ti="solid" title="خط متصل"><svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path d="M3 12h18"/></svg></button>
      <button type="button" class="q" id="dDash" data-ti="dash" title="خط متقطع"><svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-dasharray="4 3"><path d="M3 12h18"/></svg></button>
      <span class="sep"></span>
      <button type="button" class="q cbtn" id="cFill" data-k="fill" data-ti="cFill" title="التعبئة"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 12l7-7 7 7-7 7z"/></svg><span class="cbar"></span></button>
      <button type="button" class="q cbtn" id="cText" data-k="text" data-ti="cText" title="لون الكتابة"><b>أ</b><span class="cbar"></span></button>
      <button type="button" class="q cbtn" id="cMark" data-k="mark" data-ti="cMark" title="لون العلامات"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 19a12 12 0 0 1 8-12"/><path d="M5 19h14"/></svg><span class="cbar"></span></button>
      <select class="sel" id="fsSel" data-ti="fs" title="حجم الكتابة"></select>
    </div>
    <div class="sty">
      <button type="button" class="q" id="dgAr" data-ti="dgAr" title="أرقام هندية"><b style="font-size:11px">١٢</b></button>
      <button type="button" class="q" id="dgEn" data-ti="dgEn" title="أرقام إنجليزية"><b style="font-size:11px">12</b></button>
      <span class="sep"></span>
      <button type="button" class="q" id="nmText" data-ti="nmText" title="الأسماء حروف عادية"><b>أ</b></button>
      <button type="button" class="q" id="nmSym" data-ti="nmSym" title="الأسماء رموزًا"><b style="font-family:'Mazeri Arabic Math symbol';font-weight:400;font-size:17px">A</b></button>
    </div>
    <div class="sty">
      <button type="button" class="q" id="ptShow" data-ti="ptShow" title="النقاط على الرؤوس"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 19L12 5l7 14"/><circle cx="12" cy="5" r="2.6" fill="currentColor"/><circle cx="5" cy="19" r="2.6" fill="currentColor"/><circle cx="19" cy="19" r="2.6" fill="currentColor"/></svg></button>
      <button type="button" class="q cbtn" id="cPt" data-k="pt" data-ti="cPt" title="لون النقاط"><svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="11" r="5" fill="currentColor"/></svg><span class="cbar"></span></button>
      <select class="sel" id="ptSel" style="max-width:80px" data-ti="ptR" title="حجم النقطة"></select>
      <button type="button" class="q" id="ptFull" data-ti="ptFull" title="نقطة مغلقة"><svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="currentColor"/></svg></button>
      <button type="button" class="q" id="ptHollow" data-ti="ptHollow" title="نقطة مفرغة"><svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></button>
    </div>
  </div>
  <footer>By Zaher Alkablawi <span id="ver"></span></footer>
</div>

<div id="pal" hidden>
  <button type="button" class="nonec" id="palNone" data-i="noColor">بلا لون</button>
  <div class="clab" data-i="booklet">ألوان المذكرة</div><div class="mine" id="palMine"></div>
  <div class="clab" data-i="more">ألوان أخرى</div><div id="palGrid"></div>
  <button type="button" class="more" id="palMore" data-i="custom">لون آخر…</button>
  <input type="color" id="palCustom" tabindex="-1" aria-hidden="true">
</div>
<input type="file" id="picFile" accept="image/*" hidden>
<div class="modal" id="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><h3 id="modalT"></h3><div id="modalB"></div><button type="button" class="mclose" id="modalX" data-i="close">إغلاق</button></div></div>

<script>
'use strict';
const VERSION='1.0';
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const TITLE='UULA Geometry', TAG='UULA_GEOMETRY';

/* ---------- اللغة ---------- */
const T={
  loadSel:['تعديل الشكل المحدد','Edit selected shape'], fromPic:['تحويل الصورة المحددة إلى شكل','Convert the selected picture to a shape'], picReading:['جارٍ قراءة الصورة…','Reading the picture…'], picDone:['تم التعرف على الشكل. راجعه ثم اضغط «إدراج» ليحل محل الصورة.','Shape recognized. Check it, then click Insert to replace the picture.'], picDoneW:['تم التعرف على الشكل. راجعه ثم اضغط «إدراج».','Shape recognized. Check it, then click Insert.'], picFail:['لم أتعرف على شكل واضح في الصورة','No clear shape found in the picture'], picSel:['حدّد صورة الشكل أولاً','Select the picture of the shape first'], picEdit:['سيحل الشكل محل الصورة المحددة','The shape will replace the selected picture'], chkUpd:['التحقق من التحديثات','Check for updates'], about:['حول الأداة','About'],
  tabP:['مستوية','Plane'], tabC:['الدائرة','Circle'], tabS:['مجسمات','Solids'],
  type:['النوع','Type'], sides:['الأضلاع','Sides'], hidden:['الأحرف المخفية','Hidden edges'],

    if(A.right) rightMark(p,P[a],P[b]); let r0=18; if(A.arcs){ angleArcs(p,P[a],P[b],A.arcs,18); r0=18+A.arcs*4.5; } else if((A.arc||A.showAng)&&!A.right){ angleArcs(p,P[a],P[b],1,16); r0=20; }
    if(A.dir){ const rr=Math.max(r0+6,26); angleArrow(p,P[a],P[b],A.dir,rr); r0=rr+4; }
    if(A.sym||A.num) r0=angleSym(p,P[a],P[b],A.sym,A.num,A.right?12:r0)-fs*.5;
    if(A.showAng){ const s=angSpan(p,P[a],P[b]), bi=rad((s.a0+s.a1)/2), rr=r0+fs*.95+(s.sw<45?10:0); txt(add(p,[Math.cos(bi)*rr,Math.sin(bi)*rr]),A.ang||fmtAng(s.sw),{fs:fs*.85}); } });
  P.forEach((p,i)=>{ ptP(p); const V=G.verts[i]; if(!V||!V.showName) return; const nb=freeNb(G,i); let d=[0,0]; nb.forEach(j=>{ d=add(d,nrm(sub(P[j],p))); });
    d=mul(d,-1); if(len(d)<.3){ d=nb.length?perp(nrm(sub(P[nb[0]],p))):sub(p,C); if(dot(d,sub(p,C))<0) d=mul(d,-1); } nm(add(p,mul(nrm(d),fs*.95)),V.name); });
}
function buildPlane(){
  if(S.p.kind==='free') return buildFree();
  const G=S.p, P=G.pts, n=P.length, fs=LK().fs, C=cen(P);
  let nextName=n;
  const newName=()=>NAMES[nextName++]||'';
  if(LK().fill) PR.push({t:'poly',pts:P.map(p=>p.slice()),fill:LK().fill});
  for(let i=0;i<n;i++){ const sd=G.sides[i]; seg(P[i],P[(i+1)%n],{dash:sd.dash||LK().dash}); segArrows(P[i],P[(i+1)%n],sd.arr); }
  if(G.diag&&n===4){ aux(P[0],P[2]); aux(P[1],P[3]); const X=lineX(P[0],sub(P[2],P[0]),P[1],P[3]); if(X&&G.verts[0].showName) lab2(X,add(X,[0,fs*.95]),'p:x',newName()); }
  const FEET=feetList(G);
  // علامات الأضلاع
  for(let i=0;i<n;i++){ const sd=G.sides[i], a=P[i], b=P[(i+1)%n];
    const both=sd.ticks&&sd.par; sideTicks(a,b,sd.ticks,both?-9:0); parMarks(a,b,sd.par,both?9:0);
    if(sd.show){ const m=mid(a,b); let nn=perp(nrm(sub(b,a))); if(dot(nn,sub(m,C))<0) nn=mul(nn,-1); let lp=m; if(FEET.some(f=>len(sub(f,m))<fs*2)){ const d=nrm(sub(b,a)), sh=Math.min(len(sub(b,a))*.28,fs*2.6); lp=add(m,mul(d,FEET.some(f=>dot(sub(f,m),d)>0)?-sh:sh)); }
    txt(add(lp,mul(nn,fs*.95)),sd.len||fmtLen(len(sub(b,a))/40)); } }
  // الرؤوس
  FEET.forEach(f=>ptP(f));
  for(let i=0;i<n;i++){ const V=G.verts[i], p=P[i], a=P[(i-1+n)%n], b=P[(i+1)%n]; ptP(p);
    if(V.right) rightMark(p,a,b);
    let r0=18; if(V.arcs){ angleArcs(p,a,b,V.arcs,18); r0=18+V.arcs*4.5; } else if((V.showAng||V.arc)&&!V.right){ angleArcs(p,a,b,1,16); r0=20; }
    if(V.dir){ const rr=Math.max(r0+6,26); angleArrow(p,a,b,V.dir,rr); r0=rr+4; }
    if(V.sym||V.num) r0=angleSym(p,a,b,V.sym,V.num,V.right?12:r0)-fs*.5;
    if(V.showAng){ const s=angSpan(p,a,b), bi=rad((s.a0+s.a1)/2); const rr=r0+fs*.95+(s.sw<45?10:0); txt(add(p,[Math.cos(bi)*rr,Math.sin(bi)*rr]),V.ang||fmtAng(s.sw),{fs:fs*.85}); }
    if(V.showName) nm(add(p,mul(outward(P,i),fs*.95)),V.name);
  }
  // الارتفاع والمتوسط والمنصف (المثلث: إلى الضلع المقابل؛ الرباعي: من الرأس إلى ب ج)
  for(let i=0;i<n;i++){ const V=G.verts[i]; if(!(V.alt||V.med||V.bis)) continue;
    let A,B; if(n===3){ A=P[(i+1)%3]; B=P[(i+2)%3]; } else { A=P[(i+1)%n]; B=P[(i+2)%n]; }
    const p=P[i];
    if(V.alt){ const F=proj(p,A,B); aux(p,F); const t=dot(sub(F,A),sub(B,A))/dot(sub(B,A),sub(B,A));
      if(t<0) aux(A,F); if(t>1) aux(B,F);
      const ref=len(sub(B,F))>len(sub(A,F))?B:A; rightMark(F,p,ref,9);
      if(len(sub(F,A))>8&&len(sub(F,B))>8&&V.showName){ let d=nrm(sub(F,p)); lab2(F,add(F,mul(d,fs*.95)),'p:alt'+i,newName()); } }
    if(V.med&&n===3){ const M=mid(A,B); aux(p,M); if(!G.sides[(i+1)%3].ticks){ sideTicks(A,M,1); sideTicks(M,B,1); } if(V.showName){ const d=nrm(sub(M,p)); lab2(M,add(M,mul(d,fs*.95)),'p:med'+i,newName()); } }
    if(V.bis&&n===3){ const s=angSpan(p,A,B), bi=rad((s.a0+s.a1)/2), d=[Math.cos(bi),Math.sin(bi)], D=lineX(p,d,A,B);
      if(D){ aux(p,D); const h=s.sw/2; arcP(p,24,s.a0,s.a0+h); arcP(p,24,s.a0+h,s.a1);
        [s.a0+h/2,s.a0+h*1.5].forEach(a=>{ const u=[Math.cos(rad(a)),Math.sin(rad(a))]; mk(add(p,mul(u,20)),add(p,mul(u,28))); });
        if(V.showName){ const dd=nrm(sub(D,p)); lab2(D,add(D,mul(dd,fs*.95)),'p:bis'+i,newName()); } } }
  }
}

function feetList(G){ const P=G.pts, n=P.length, out=[];
  G.verts.forEach((V,i)=>{ const A=P[(i+1)%n], B=P[(i+2)%n], p=P[i];
    if(V.alt) out.push(proj(p,A,B)); if(V.med&&n===3) out.push(mid(A,B));
    if(V.bis&&n===3){ const s=angSpan(p,A,B), bi=rad((s.a0+s.a1)/2), D=lineX(p,[Math.cos(bi),Math.sin(bi)],A,B); if(D) out.push(D); } });
  if(G.diag&&n===4){ const X=lineX(P[0],sub(P[2],P[0]),P[1],P[3]); if(X) out.push(X); }
  return out; }
/* ---------- الدائرة ---------- */
function buildCircle(){
  const K=S.c, c=K.c, r=K.r, sh=K.show, fs=LK().fs, A=K.a;
  const P=k=>[c[0]+r*Math.cos(rad(A[k])), c[1]+r*Math.sin(rad(A[k]))];
  const lab=(k,name)=>{ ptP(P(k)); if(!sh.names) return; const d=[Math.cos(rad(A[k])),Math.sin(rad(A[k]))]; lab2(P(k),add(c,mul(d,r+fs*.9)),'c:'+k,name); };
  const swGH=(((A.G-A.H)%360)+360)%360;
  if(sh.sector) PR.push({t:'pie',c,r,a0:A.H,a1:A.H+swGH,fill:LK().fill||'#cfe0f8'});
  PR.push({t:'ell',c,rx:r,ry:r,a0:0,a1:360,c2:LK().line,w:LK().w,dash:LK().dash,fill:sh.sector?null:LK().fill});
  if(sh.arc) PR.push({t:'ell',c,rx:r,ry:r,a0:A.H,a1:A.H+swGH,c2:LK().mark,w:LK().w*1.8,dash:false});
  if(sh.center){ dotP(c); if(sh.names) lab2(c,add(c,[fs*.7,fs*.75]),'c:C','م'); }
  if(sh.radius){ seg(c,P('A')); if(sh.meas) txt(add(mid(c,P('A')),mul(perp(nrm(sub(P('A'),c))),-fs*.8)),'نق',{fs:fs*.85}); lab('A','أ'); }
  if(sh.diam){ seg(P('B'),[2*c[0]-P('B')[0],2*c[1]-P('B')[1]]); const opp=A.B+180; lab('B','ب'); ptP([2*c[0]-P('B')[0],2*c[1]-P('B')[1]]); if(sh.names){ const d=[Math.cos(rad(opp)),Math.sin(rad(opp))]; lab2(add(c,mul(d,r)),add(c,mul(d,r+fs*.9)),'c:B2','ج'); } }
  if(sh.chord){ seg(P('D'),P('E')); lab('D','د'); lab('E','هـ'); }
  if(sh.tangent){ const p=P('F'), d=perp([Math.cos(rad(A.F)),Math.sin(rad(A.F))]), L2=r*.85; seg(add(p,mul(d,L2)),sub(p,mul(d,L2))); rightMark(p,c,add(p,d),9); aux(c,p); if(!LK().ptShow) dotP(p); lab('F','و'); }
  const needGH=sh.arc||sh.sector||sh.central||sh.inscribed;
  if(sh.sector||sh.central){ seg(c,P('G')); seg(c,P('H')); }
  if(sh.central){ const s=angSpan(c,P('G'),P('H')); arcP(c,18,s.a0,s.a1); if(sh.meas){ const bi=rad((s.a0+s.a1)/2); txt(add(c,[Math.cos(bi)*(30+fs*.4),Math.sin(bi)*(30+fs*.4)]),fmtAng(s.sw),{fs:fs*.85}); } }
  if(sh.inscribed){ const v=P('I'); seg(v,P('G')); seg(v,P('H')); const s=angSpan(v,P('G'),P('H')); arcP(v,18,s.a0,s.a1); lab('I','ط');
    if(sh.meas){ const bi=rad((s.a0+s.a1)/2); txt(add(v,[Math.cos(bi)*(30+fs*.4),Math.sin(bi)*(30+fs*.4)]),fmtAng(s.sw),{fs:fs*.85}); } }
  if(needGH){ lab('G','ز'); lab('H','ح'); }
}

/* ---------- المجسمات (إسقاط مائل) ---------- */
const KX=.42*Math.cos(rad(38)), KY=.42*Math.sin(rad(38));
const VIEW=[-KX,-KY,1];
function buildSolid(){
  const Z=S.s, k=Z.kind, sz=Z.size[k], lb=Z.lab[k], fs=LK().fs, hid=Z.hidden;
  const hidOpt=()=>hid==='solid'?{dash:LK().dash}:{dash:true,w:Math.max(1,LK().w*.8)};
  if(k==='cube'||k==='box'||k==='prism'||k==='pyr'){
    const w=sz.w, h=k==='cube'?sz.w:sz.h, d=k==='cube'?sz.w:sz.d;
    let V3,F,NM;
    if(k==='cube'||k==='box'){ V3=[[0,0,0],[w,0,0],[w,0,d],[0,0,d],[0,h,0],[w,h,0],[w,h,d],[0,h,d]]; F=[[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7],[4,5,6,7],[0,3,2,1]]; }
    else if(k==='prism'){ V3=[[0,0,0],[w,0,0],[w/2,h,0],[0,0,d],[w,0,d],[w/2,h,d]]; F=[[0,1,2],[3,5,4],[0,3,4,1],[1,4,5,2],[2,5,3,0]]; }
    else { V3=[[0,0,0],[w,0,0],[w,0,d],[0,0,d],[w/2,h,d/2]]; F=[[0,1,2,3],[0,4,1],[1,4,2],[2,4,3],[3,4,0]]; }
    const c3=V3.reduce((s,p)=>[s[0]+p[0],s[1]+p[1],s[2]+p[2]],[0,0,0]).map(v=>v/V3.length);
    const vis=F.map(f=>{ const a=V3[f[0]],b=V3[f[1]],c=V3[f[2]]; const u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]], v=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];
      let n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]]; const fc=f.reduce((s,i)=>[s[0]+V3[i][0],s[1]+V3[i][1],s[2]+V3[i][2]],[0,0,0]).map(x=>x/f.length);
      if(n[0]*(fc[0]-c3[0])+n[1]*(fc[1]-c3[1])+n[2]*(fc[2]-c3[2])<0) n=n.map(x=>-x);
      return n[0]*VIEW[0]+n[1]*VIEW[1]+n[2]*VIEW[2]<-1e-9; });
    const pr=p=>[p[0]+p[2]*KX, -p[1]-p[2]*KY];
    let P2=V3.map(pr); const bb=bboxPts(P2), off=[160-(bb.x+bb.w/2),125-(bb.y+bb.h/2)]; P2=P2.map(p=>add(p,off));
    SOL={pts:P2,w,h,d,off};
    const E=new Map(); F.forEach((f,fi)=>f.forEach((a,j)=>{ const b=f[(j+1)%f.length], key=a<b?a+'-'+b:b+'-'+a; E.set(key,(E.get(key)||false)||vis[fi]); }));
    if(LK().fill){ F.forEach((f,fi)=>{ if(vis[fi]) PR.push({t:'poly',pts:f.map(i=>P2[i].slice()),fill:LK().fill}); }); }
    E.forEach((v,key)=>{ const [a,b]=key.split('-').map(Number); if(v) seg(P2[a],P2[b]); else if(hid!=='hide') seg(P2[a],P2[b],hidOpt()); });
    const C2=cen(P2);
    P2.forEach(p=>ptP(p));
    if(Z.names) P2.forEach((p,i)=>{ const dd=nrm(sub(p,C2)); lab2(p,add(p,mul(dd,fs*.95)),'s:'+k+':'+i,NAMES[i]); });
    if(Z.dims){
      if(k==='cube'||k==='box'){ const m=mid(P2[0],P2[1]); txt(add(m,[0,fs*1.05]),lb.w);
        if(k==='box'){ txt(add(mid(P2[1],P2[5]),[-fs*1.6,0]),lb.h); const md=mid(P2[1],P2[2]); txt(add(md,[fs*1.5,fs*.3]),lb.d); } }
      else if(k==='prism'){ txt(add(mid(P2[0],P2[1]),[0,fs*1.05]),lb.w); const md=mid(P2[1],P2[4]); txt(add(md,[fs*1.5,fs*.3]),lb.d);
        const F0=mid(P2[0],P2[1]); aux(P2[2],F0); rightMark(F0,P2[2],P2[1],8); txt(add(mid(P2[2],F0),[fs*.75,0]),lb.h); }
      else { const bc=mid(P2[0],P2[2]); aux(P2[4],bc); dotP(bc); txt(add(mid(P2[4],bc),[fs*.8,0]),lb.h); txt(add(mid(P2[0],P2[1]),[0,fs*1.05]),lb.w); }
    }
    return;
  }
  // الأجسام الدورانية
  const r=sz.r, ry=r*.32, H=k==='sph'?0:sz.h;
  const cx=160, by=k==='sph'?125:125+H/2, ty=by-H;
  SOL={cx,by,ty,r,ry,H};
  const ell=(cy,a0,a1,o)=>PR.push({t:'ell',c:[cx,cy],rx:r,ry,a0,a1,c2:LK().line,w:o&&o.w||LK().w,dash:o?!!o.dash:LK().dash});
  if(k==='cyl'){
    if(LK().fill) PR.push({t:'poly',pts:[[cx-r,ty],[cx+r,ty],[cx+r,by],[cx-r,by]],fill:LK().fill});
    ell(ty,0,360); seg([cx-r,ty],[cx-r,by]); seg([cx+r,ty],[cx+r,by]); ell(by,0,180);
    if(hid!=='hide') ell(by,180,360,hidOpt());
    if(Z.centers){ dotP([cx,by]); dotP([cx,ty]); }
    if(Z.dims){ aux([cx,by],[cx+r,by]); txt([cx+r/2,by-fs*.75],lb.r); aux([cx,ty],[cx,by]); txt([cx-fs*.75,(ty+by)/2],lb.h); }
  } else if(k==='cone'){
    const yt=-ry*ry/H, xt=r*Math.sqrt(Math.max(0,1-ry*ry/(H*H)));     // نقطتا التماس
    const aR=ang([xt/r,yt/ry]), aL=180-aR;
    seg([cx,ty],[cx+xt,by+yt]); seg([cx,ty],[cx-xt,by+yt]);
    ell(by,aR,aL); if(hid!=='hide') ell(by,aL,aR+360,hidOpt());
    if(Z.centers) dotP([cx,by]);
    if(Z.dims){ aux([cx,ty],[cx,by]); rightMark([cx,by],[cx,ty],[cx+r,by],8); aux([cx,by],[cx+r,by]); txt([cx+r/2,by+fs*.8],lb.r); txt([cx-fs*.75,(ty+by)/2],lb.h);
      txt(add(mid([cx,ty],[cx+xt,by+yt]),[fs*.8,-fs*.2]),lb.l); }
  } else {
    PR.push({t:'ell',c:[cx,by],rx:r,ry:r,a0:0,a1:360,c2:LK().line,w:LK().w,dash:LK().dash,fill:LK().fill});
    ell(by,0,180,{w:Math.max(1,LK().w*.8)}); if(hid!=='hide') ell(by,180,360,hidOpt());
    if(Z.centers) dotP([cx,by]);
    if(Z.dims){ aux([cx,by],[cx+r,by]); txt([cx+r/2,by-fs*.75],lb.r); }
  }
}
let SOL=null, REG=[], FREE0=null;
// نقطة لها اسم: يمكن إخفاء اسمها أو تغييره بالنقر عليها
function lab2(p,pos,key,def){ REG.push({p,key,def}); if(!(S.hide&&S.hide[key])) nm(pos,(S.nm&&S.nm[key]!=null)?S.nm[key]:def); }
function bboxPts(P){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; P.forEach(p=>{ x0=Math.min(x0,p[0]); y0=Math.min(y0,p[1]); x1=Math.max(x1,p[0]); y1=Math.max(y1,p[1]); }); return {x:x0,y:y0,w:x1-x0,h:y1-y0}; }
function build(){ PR=[]; REG=[]; if(S.empty) return PR; if(S.tab==='p') buildPlane(); else if(S.tab==='c') buildCircle(); else buildSolid(); return PR; }

/* نقطة على قطع ناقص بزاوية مرئية (مثل أقواس باوربوينت) */
function ellPt(c,rx,ry,a){ const t=rad(a), co=Math.cos(t), si=Math.sin(t), k=rx*ry/Math.sqrt((ry*co)**2+(rx*si)**2); return [c[0]+k*co,c[1]+k*si]; }
function bboxPrims(pr){ const pts=[]; pr.forEach(p=>{
  if(p.t==='seg'){ pts.push(p.a,p.b); }
  else if(p.t==='ell'||p.t==='pie'){ const rx=p.rx||p.r, ry=p.ry||p.r, sw=p.a1-p.a0; for(let i=0;i<=36;i++){ const a=p.a0+sw*i/36; pts.push(ellPt(p.c,rx,ry,a)); } if(p.t==='pie') pts.push(p.c); }
  else if(p.t==='poly'){ pts.push(...p.pts); }
  else if(p.t==='txt'){ const w=p.fs*.6*Math.max(1,p.s.length)/2+2, h=p.fs*.7; pts.push([p.p[0]-w,p.p[1]-h],[p.p[0]+w,p.p[1]+h]); }
  else if(p.t==='dot'){ pts.push([p.p[0]-p.r,p.p[1]-p.r],[p.p[0]+p.r,p.p[1]+p.r]); } });
  return pts.length?bboxPts(pts):{x:0,y:0,w:1,h:1}; }

/* ---------- SVG ---------- */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const f2=v=>Math.round(v*100)/100;
function arcPath(c,rx,ry,a0,a1){ const sw=a1-a0; if(sw>=359.99){ return `M${f2(c[0]-rx)} ${f2(c[1])}a${f2(rx)} ${f2(ry)} 0 1 0 ${f2(2*rx)} 0a${f2(rx)} ${f2(ry)} 0 1 0 ${f2(-2*rx)} 0z`; }
  const p0=ellPt(c,rx,ry,a0), p1=ellPt(c,rx,ry,a1); return `M${f2(p0[0])} ${f2(p0[1])}A${f2(rx)} ${f2(ry)} 0 ${sw>180?1:0} 1 ${f2(p1[0])} ${f2(p1[1])}`; }
const dashA=w=>`${f2(w*3)} ${f2(w*2.2)}`;
function primSVG(p){
  if(p.t==='seg') return `<path d="M${f2(p.a[0])} ${f2(p.a[1])}L${f2(p.b[0])} ${f2(p.b[1])}" stroke="${p.c}" stroke-width="${p.w}" stroke-linecap="round"${p.dash?` stroke-dasharray="${dashA(p.w)}"`:''} fill="none"/>`;
  if(p.t==='ell') return `<path d="${arcPath(p.c,p.rx,p.ry,p.a0,p.a1)}" stroke="${p.c2}" stroke-width="${p.w}" fill="${p.fill||'none'}"${p.dash?` stroke-dasharray="${dashA(p.w)}"`:''}/>`;
  if(p.t==='pie'){ const a=ellPt(p.c,p.r,p.r,p.a0); return `<path d="M${f2(p.c[0])} ${f2(p.c[1])}L${f2(a[0])} ${f2(a[1])}${arcPath(p.c,p.r,p.r,p.a0,p.a1).replace(/^M[^A]*/,'')}Z" fill="${p.fill}" stroke="none"/>`; }
  if(p.t==='poly') return `<path d="M${p.pts.map(q=>f2(q[0])+' '+f2(q[1])).join('L')}Z" fill="${p.fill}" stroke="none"/>`;
  if(p.t==='txt') return `<text x="${f2(p.p[0])}" y="${f2(p.p[1])}" font-family="${p.font||'UULA Sans'}" font-size="${p.fs}" fill="${p.c}" text-anchor="middle" dominant-baseline="central" direction="${p.font?'ltr':'rtl'}">${esc(p.s)}</text>`;
  if(p.t==='dot') return p.fill===false?`<circle cx="${f2(p.p[0])}" cy="${f2(p.p[1])}" r="${p.r}" fill="#ffffff" stroke="${p.c}" stroke-width="${p.w}"/>`:`<circle cx="${f2(p.p[0])}" cy="${f2(p.p[1])}" r="${p.r}" fill="${p.c}"/>`;

  });
}

    const F=proj(P[vi],A,B), M=mid(A,B), s2=angSpan(P[vi],A,B), bi=rad((s2.a0+s2.a1)/2), D=lineX(P[vi],[Math.cos(bi),Math.sin(bi)],A,B), tol=len(sub(B,A))*.04;

function classify(r){
  let P=r.pts.map(p=>p.slice()); const n=P.length;
  let A2=0; for(let i=0;i<n;i++){ const a=P[i], b=P[(i+1)%n]; A2+=a[0]*b[1]-b[0]*a[1]; } if(A2>0) P.reverse();   // نفس اتجاه رسم الأداة

  const L=i=>len(sub(P[(i+1)%n],P[i])), near=(a,b,t)=>Math.abs(a-b)<=t*Math.max(a,b);
  const angAt=i=>angSpan(P[i],P[(i-1+n)%n],P[(i+1)%n]).sw;
  const rotTo=j=>{ P=P.slice(j).concat(P.slice(0,j)); };
  let kind='poly', sub2='iso';
  if(n===3){ kind='tri'; const s=[L(0),L(1),L(2)];
    if(near(s[0],s[1],.03)&&near(s[1],s[2],.03)&&[0,1,2].every(i=>Math.abs(angAt(i)-60)<3)) sub2='equ';
    else { let ri=-1; for(let i=0;i<3;i++) if(Math.abs(angAt(i)-90)<4) ri=i;
      if(ri===1) sub2='rt';
      else { let ap=-1, bd=1; for(let i=0;i<3;i++){ const a=L((i+2)%3), b=L(i), d=Math.abs(a-b)/Math.max(a,b); if(d<.03&&d<bd){ bd=d; ap=i; } } sub2=ap===0?'iso':'sca'; } } }   // الرأس العلوي «أ» كما في الصورة
  else if(n===4){ const dirA=i=>{ const d=sub(P[(i+1)%4],P[i]); return ((ang(d)%180)+180)%180; }, par=(i,j)=>{ const x=Math.abs(dirA(i)-dirA(j)); return Math.min(x,180-x)<5; };
    const p02=par(0,2), p13=par(1,3), dg=Math.abs(((ang(sub(P[2],P[0]))-ang(sub(P[3],P[1])))%180+180)%180-90), eq=dg<3&&near(L(0),L(1),.04)&&near(L(1),L(2),.04), rt=[0,1,2,3].every(i=>Math.abs(angAt(i)-90)<4);
    if(p02&&p13){ kind=eq?(rt?'sq':'rho'):(rt?'rect':'para'); if(kind==='rho'){ let t=0; P.forEach((p,i)=>{ if(p[1]<P[t][1]) t=i; }); rotTo(t); } }
    else if(p02||p13){ kind='trap'; if(p02) rotTo(3); }   // الضلعان المتوازيان: ب ج و د أ
  }
  return {kind,sub:sub2,pts:P};
}
async function pictureToShape(src,ed){
  msg(L('picReading'));
  const im=await loadImg(src), r=recognize(im);
  if(!r){ msg(L('picFail'),'bad'); return; }
  push(); closePop(); S.empty=false;
  const A=ed&&ed.width?ed.width/r.W:0;   // من بكسلات الصورة إلى نقاط الشريحة
  let fit;
  if(r.type==='circle'){ const s=Math.min(1.5,170/(2*r.r)); fit={s,cx:r.c[0],cy:r.c[1]}; S.tab='c'; const d=defaults().c; S.c=d; S.c.r=r.r*s; S.c.c=[160,125];
    const cp=circleParts(r), sh=Object.assign(d.show,{radius:false,center:!!cp.center||!!(cp.radius!=null||cp.diam!=null||cp.central)}), A=S.c.a;
    if(cp.radius!=null){ sh.radius=true; A.A=Math.round(cp.radius); }
    if(cp.diam!=null){ sh.diam=true; A.B=Math.round(cp.diam); }
    if(cp.central){ sh.central=true; A.H=Math.round(cp.central[0]); A.G=Math.round(cp.central[1]); if((((A.G-A.H)%360)+360)%360>180){ const t2=A.G; A.G=A.H; A.H=t2; } if(cp.sector) sh.sector=true; }
    if(cp.inscribed){ sh.inscribed=true; A.I=Math.round(cp.inscribed[0]); if(!cp.central){ A.H=Math.round(cp.inscribed[1]); A.G=Math.round(cp.inscribed[2]); if((((A.G-A.H)%360)+360)%360>180){ const t2=A.G; A.G=A.H; A.H=t2; } } }
    if(cp.chord){ sh.chord=true; A.D=Math.round(cp.chord[0]); A.E=Math.round(cp.chord[1]); }
    if(cp.tangent!=null){ sh.tangent=true; A.F=Math.round(cp.tangent); }
    sh.names=r.texts.length>0; }
  else if(r.type==='poly'&&(FREE0=compose(r,classify(r)))){ const G=FREE0, bb=bboxPts(G.pts), s=Math.min(260/bb.w,195/bb.h), cxi=bb.x+bb.w/2, cyi=bb.y+bb.h/2; fit={s,cx:cxi,cy:cyi};
    G.pts=G.pts.map(p=>[160+(p[0]-cxi)*s,122+(p[1]-cyi)*s]); S.tab='p'; S.p=G; FT='move'; }
  else { const c0=classify(r), c=idealize(c0), bb=bboxPts(c.pts), s=Math.min(260/bb.w,195/bb.h), cxi=bb.x+bb.w/2, cyi=bb.y+bb.h/2; fit={s,cx:cxi,cy:cyi};

    for(let i=0;i<n;i++){ const p=P0[i], a=P0[(i+1)%n], b=P0[(i+2)%n];
      if(n===3){ const F2=proj(p,a,b), M2=mid(a,b), far=q=>len(sub(q,a))>len(sub(b,a))*.1&&len(sub(q,b))>len(sub(b,a))*.1;

  else if(S.tab==='c'){ S.c.show.names=false; S.c.show.meas=false; }
  if(ed){ const e=Object.assign({},ed,{pic:true}); if(A&&!ed.word){ const a=A/fit.s; e.place={a, bx:ed.left+(fit.cx-160/fit.s)*A, by:ed.top+(fit.cy-(S.tab==='c'?125:122)/fit.s)*A}; } setEdit(e); }

async function selectedPicture(){
  if(HOST==='PowerPoint'){ let out=null;
    await PowerPoint.run(async ctx=>{ const ss=ctx.presentation.getSelectedShapes(); ss.load('items/id,items/left,items/top,items/width,items/height'); await ctx.sync();
      if(!ss.items.length) throw L('picSel'); const s=ss.items[0], img=s.getImageAsBase64({format:'Png'}); await ctx.sync();
      out={src:'data:image/png;base64,'+img.value, ed:{id:s.id,left:s.left,top:s.top,width:s.width,height:s.height}}; });
    return out; }
  let out=null;
  await Word.run(async ctx=>{ const pics=ctx.document.getSelection().inlinePictures; pics.load('items'); await ctx.sync(); if(!pics.items.length) throw L('picSel');
    const b=pics.items[0].getBase64ImageSrc(); await ctx.sync(); out={src:'data:image/png;base64,'+b.value, ed:{word:true}}; });
  return out;
}
const fromPic=async()=>{ if(!HOST){ $('picFile').value=''; $('picFile').click(); return; }
  try{ const s=await selectedPicture(); await pictureToShape(s.src,s.ed); }catch(e){ console.error(e); msg(typeof e==='string'?e:L('picFail'),'bad'); } };
$('fromPicItem').addEventListener('click',fromPic); $('picBtn').addEventListener('click',fromPic);
$('picFile').addEventListener('change',()=>{ const f=$('picFile').files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>pictureToShape(rd.result,null); rd.readAsDataURL(f); });

(function(){
  const head=()=>fetch('app.html?chk='+Date.now(),{method:'HEAD',cache:'no-store'}).then(r=>r.ok?(r.headers.get('etag')||r.headers.get('last-modified')):null).catch(()=>null);
  let base=null, last=0;
  const check=async manual=>{ last=Date.now(); const t=await head();
    if(!base){ base=t; if(manual) msg(t?L('latest'):L('noConn')); return; }
    if(t&&t!==base){ $('updBtn').hidden=false; if(manual) msg(L('hasUpd')); }
    else if(manual) msg(t?L('latest'):L('noConn'),t?'good':'bad'); };
  head().then(t=>{ base=t; });
  setInterval(()=>check(false),60*60*1000);
  const soon=()=>{ if(Date.now()-last>60*60*1000) check(false); };
  addEventListener('focus',soon); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) soon(); });
  $('chkUpd').addEventListener('click',()=>check(true));
  $('updBtn').addEventListener('click',()=>{ save(); location.replace((location.pathname.split('/').pop()||'app.html')+'?v='+Date.now()); });
})();
