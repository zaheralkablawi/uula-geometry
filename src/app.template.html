<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UULA Geometry</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
/*FONT*/
:root{--bg:#f3f5f8;--panel:#fff;--fg:#18212e;--muted:#5d6878;--line:#d9dfe7;--accent:#1f71de;--soft:#e7effc;--danger:#b8372b;--ok:#1d7a4f}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:14px "UULA Sans",-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.45}
button,input,select{font-family:inherit;color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:6px 8px 8px;display:flex;flex-direction:column;gap:6px}
header{display:flex;align-items:center;gap:6px;position:relative}
header h1{margin:0;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
header h1 svg.logo{width:30px;height:30px;flex:none}
header .bt{display:flex;flex-direction:column;justify-content:center;line-height:15px}
header .root{color:#1f71de;font-size:14px;font-weight:600;letter-spacing:.03em}
header .sub{color:#9aa3b0;font-size:13px;font-weight:500}
header .bt .root:only-child{color:var(--fg);font-size:15px;letter-spacing:0}
.ib{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--fg);position:relative;padding:0;cursor:pointer;flex:none}
.ib:hover{border-color:var(--accent)}
.ib:disabled{opacity:.45;cursor:default}
.hsp{flex:1}
.updbtn .dot{position:absolute;top:3px;left:3px;width:7px;height:7px;border-radius:50%;background:#e5322d}
.appmenu{position:static}
.menu{position:absolute;top:34px;left:0!important;right:auto!important;z-index:60;min-width:190px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:4px;display:flex;flex-direction:column}
.menu button{border:0;background:none;text-align:start;padding:6px 9px;border-radius:5px;font-size:12px;cursor:pointer}
.menu button:hover{background:var(--bg)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{flex:1;height:28px;border:0;background:none;font-size:12.5px;cursor:pointer;white-space:nowrap;padding:0 5px}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.gal{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
#galP{grid-template-columns:repeat(9,1fr)}
.tabi{flex:none}
.tabi button{width:40px;font-size:12.5px;flex:none;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.opt>.label{display:none}
.opt .seg button svg{display:block;margin:auto}
.sec .sty+.sty,.sec .chips+.sty{border-top:1px solid var(--line);padding-top:6px}
.chips .q{width:28px;height:28px}
#fig{max-height:min(48vh,290px)}
.gal button{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.gal button:hover{border-color:var(--accent)}
.gal button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt{display:flex;align-items:center;gap:6px}
.opt>.label{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.opt .seg{flex:1}
.opt .seg button{font-size:11.5px;height:26px;flex:auto;padding:0 4px}
.opt .seg{min-width:0}
.pv{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;padding-bottom:36px}
#fig{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
#fig .hs{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
#fig .hs:hover{stroke:rgba(31,113,222,.18)}
#fig .hs.sel{stroke:rgba(31,113,222,.28)}
#fig .hb{fill:transparent;cursor:move}
#fig .hv{fill:transparent;pointer-events:all;stroke:#1f71de;stroke-width:1.6;cursor:grab}
#fig .hv.sel{stroke-width:3}
#fig .ha{fill:transparent;stroke:none;pointer-events:all;cursor:pointer}
#fig .ha:hover{fill:rgba(31,113,222,.10)}
#fig .ha.sel{fill:rgba(31,113,222,.2)}
#fig .hp{stroke-dasharray:2 2;cursor:pointer}
#fig .hc{fill:none;stroke:transparent;stroke-width:12;cursor:ew-resize}
.ins{position:absolute;left:6px;bottom:6px;height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:#fff;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;cursor:pointer}
.ins:hover{filter:brightness(1.08)}
.ins:disabled{opacity:.5;cursor:default}
.pvt{position:absolute;right:6px;bottom:6px;display:flex;gap:4px}
.pvt .ib{width:26px;height:26px}
.edbar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--soft);border:1px solid #bcd3f5;border-radius:8px;padding:4px 8px;font-size:12px;color:var(--accent)}
.edbar button{border:1px solid var(--line);background:#fff;border-radius:6px;font-size:12px;height:24px;padding:0 8px;cursor:pointer}
#msg{unicode-bidi:plaintext;font-size:12.8px;color:var(--muted);text-align:center;min-height:0}
#ctx{position:fixed;z-index:85;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:5px;display:flex;flex-direction:column;gap:4px}
#ctx .r{display:flex;gap:4px;align-items:center}
#ctx .sep2{width:6px;flex:none}
#msg:empty{display:none}
#hint{text-align:center}
#hint:empty{display:none}
#msg.bad{color:var(--danger)}#msg.good{color:var(--ok)}
.pop{position:relative;background:#fff;border:1px solid #bcd3f5;border-radius:10px;box-shadow:0 2px 8px rgba(31,113,222,.12);padding:8px;display:flex;flex-direction:column;gap:6px;font-size:12px;width:auto!important}
.pop .r input{max-width:150px!important}
.pop input.w1{flex:none;width:44px}
.pop input.w2{flex:none;width:60px}
.pop .sep2{width:6px;flex:none}
.pop{gap:5px;padding:6px 8px}
.pop .angico{display:inline-flex;align-items:center;gap:3px}
.pop .ph{font-weight:600;color:var(--muted);font-size:11.5px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.pop .ph>span{margin-inline-end:2px}
.pop .ph input{font-weight:400}
.pop .ph>[data-a="delo"]{margin-inline-start:auto}
.pop .ph>[data-a="delo"]:hover{color:#c00000;border-color:#e3a0a0;background:#fff3f3}
.pop .ph>[data-a="x"]{border:0;background:none;cursor:pointer;color:var(--muted);font-size:13px;padding:0 2px}
.pop .r{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pop input{flex:1;min-width:0;height:26px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;padding:0 6px;text-align:center}
.pop input:focus{outline:none;border-color:var(--accent)}
.q{width:26px;height:26px;border:1px solid var(--line);border-radius:6px;background:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer;position:relative;flex:none}
.q:hover{border-color:var(--accent)}
.q[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.q .cbar{position:absolute;left:5px;right:5px;bottom:3px;height:3px;border-radius:2px;border:1px solid rgba(0,0,0,.12)}
.q.none .cbar{background:linear-gradient(135deg,#fff 40%,#e05a4f 40%,#e05a4f 60%,#fff 60%)!important}
.q b{font-size:12px;font-weight:600}
.sec{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:6px}
.sec>.label{font-size:12px;font-weight:600;color:var(--muted)}
.note{font-size:11.8px;color:var(--muted);unicode-bidi:plaintext}
.sel{direction:ltr}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{height:26px;padding:0 9px;border:1px solid var(--line);border-radius:13px;background:#fff;font-size:12px;display:inline-flex;align-items:center;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.dims{display:flex;flex-wrap:wrap;gap:6px}
.dims label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.dims input{width:64px;height:26px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;padding:0 6px;text-align:center}
.sty{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.sty .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
.sel{height:26px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:12px;padding:0 2px;cursor:pointer;max-width:62px}
footer{text-align:center;font-size:11.5px;color:var(--muted);direction:ltr}
#pal{position:fixed;z-index:80;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:7px;width:232px}
#pal .clab{font-size:12px;color:var(--muted);font-weight:600;margin:2px 0 4px}
#pal .row{display:grid;grid-template-columns:repeat(10,18px);gap:3px;direction:ltr}
#pal .sw{width:18px;height:18px;border:1px solid rgba(0,0,0,.15);padding:0;cursor:pointer}
#pal .sw:hover{outline:2px solid var(--accent);outline-offset:1px}
#pal .mine{display:flex;gap:6px;margin-bottom:6px;direction:ltr}
#pal .mine .sw{width:22px;height:22px;border-radius:5px}
#pal .gap{height:5px}
#pal .more,#pal .nonec{margin-top:6px;width:100%;height:26px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:12px;cursor:pointer}
#pal .nonec{margin:0 0 6px}
#palCustom{position:absolute;width:0;height:0;opacity:0;border:0;padding:0}
.modal{position:fixed;inset:0;background:rgba(15,20,30,.35);display:flex;align-items:center;justify-content:center;z-index:90;padding:16px}
.mbox{background:#fff;border-radius:10px;padding:14px;max-width:320px;width:100%;font-size:13px;line-height:1.7}
.mbox h3{margin:0 0 6px;font-size:14px}
.mbox .mclose{margin-top:8px;height:28px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 12px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <h1 dir="ltr"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12.5" fill="none" stroke="#1f71de" stroke-width="2.6"/><path d="M16 8.6L23.4 21.6H8.6z" fill="none" stroke="#1f71de" stroke-width="2.3" stroke-linejoin="round"/></svg><span class="bt"><span class="root">UULA</span><span class="sub">Geometry</span></span></h1>
    
    <span class="hsp"></span>
    <div class="seg tabi" id="tabs" role="tablist"><button type="button" data-tab="p" data-ti="tabP" title="مستوية"><b dir="ltr">2D</b></button><button type="button" data-tab="s" data-ti="tabS" title="مجسمات"><b dir="ltr">3D</b></button></div>
    <span class="hsp"></span>
    <button type="button" class="ib updbtn" id="updBtn" hidden data-ti="upd" title="تحديث جديد" aria-label="تحديث جديد"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10a6 6 0 1 1-1.8-4.3"/><path d="M16.2 3.2v3.5h-3.5"/></svg><span class="dot"></span></button>
    <div class="appmenu" id="menuWrap">
      <button type="button" class="ib" id="menuBtn" aria-haspopup="true" aria-expanded="false" data-ti="menu" title="القائمة" aria-label="القائمة"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 6h12M4 10h12M4 14h12"/></svg></button>
      <div class="menu" id="appMenu" role="menu" hidden>
        <button type="button" role="menuitem" id="loadSelItem" data-act="edit" data-i="loadSel">تعديل الشكل المحدد</button>
        <button type="button" role="menuitem" id="fromPicItem" data-act="pic" data-i="fromPic">تحويل الصورة المحددة إلى شكل</button>
        <button type="button" role="menuitem" id="chkUpd" data-i="chkUpd">التحقق من التحديثات</button>
        <button type="button" role="menuitem" id="langItem">English</button>
        <button type="button" role="menuitem" id="aboutBtn" data-i="about">حول الأداة</button>
      </div>
    </div>
  </header>


  <div class="gal" id="galP"></div>
  <div class="gal" id="galS"></div>

  <div class="opt" id="optTri"><span class="label" data-i="type">النوع</span><div class="seg" id="segTri"></div></div>
  <div class="opt" id="optFree"><span class="label" data-i="tools">أدوات</span><div class="seg" id="segFree"></div></div>
  <div class="opt" id="optN"><span class="label" data-i="sides">الأضلاع</span><div class="seg" id="segN"></div></div>
  <div class="opt" id="optHid"><span class="label" data-i="hidden">الأحرف المخفية</span><div class="seg" id="segHid"></div></div>

  <div class="edbar" id="edBar" hidden><span data-i="editing">تعديل شكل محدد</span><button type="button" id="edCancel" data-i="cancel">إلغاء</button></div>

  <div class="pv" id="pv">
    <svg id="fig" viewBox="0 0 320 250" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="pvt">
      <button type="button" class="ib" id="picBtn" data-ti="fromPic" title="تحويل الصورة المحددة إلى شكل"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="4" width="10" height="9" rx="1.5"/><path d="M3 11l3-3 3 3"/><path d="M15 9h3l-1.5-1.5M18 9l-1.5 1.5"/><path d="M14 20l3.5-6 3.5 6z"/></svg></button>
      <button type="button" class="ib" id="editBtn" data-ti="loadSel" title="تعديل الشكل المحدد"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></button>
      <button type="button" class="ib" id="picSlideBtn" data-ti="picSlide" title="تحويل كل صور الأشكال في هذه الشريحة"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15l3-4 3 3 2-2 3 3"/><circle cx="16" cy="9" r="1.3" fill="currentColor"/></svg></button>
      <button type="button" class="ib" id="picAllBtn" data-ti="picAll" title="تحويل كل صور الأشكال في كل الشرائح"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="6" y="3" width="15" height="12" rx="2"/><path d="M3 7v12a2 2 0 0 0 2 2h12"/><path d="M9 12l2.5-3 2.5 2.5 1.5-1.5 2.5 2"/></svg></button>
      <button type="button" class="ib" id="undoBtn" data-ti="undo" title="تراجع"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
      <button type="button" class="ib" id="rotBtn" data-ti="rot" title="تدوير"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4.5L15 9l-6 4.5z" transform="rotate(-20 12 9)"/><path d="M5 17a8 8 0 0 0 14 0"/><path d="M19 13v4h-4"/></svg></button>
      <button type="button" class="ib" id="flipBtn" data-ti="flip" title="انعكاس"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3v18M9 7L3 17h6zM15 7l6 10h-6z"/></svg></button>
      <button type="button" class="ib" id="resetBtn" data-ti="reset" title="الشكل الأصلي"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.3-5.7"/><path d="M4 4v5h5"/></svg></button>
      <button type="button" class="ib" id="clearBtn" data-ti="clear" title="مسح الرسم"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg></button>
    </div>
    <button type="button" class="ins" id="insert" data-ti="insert" title="إدراج"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><span id="insTxt" data-i="insert">إدراج</span></button>
  </div>
  <div class="pop" id="pop" hidden></div>
  <div id="msg" role="status"></div>

  <div class="note" id="hint"></div>
  <div class="sec">
    <div class="chips" id="chips"></div>
    <div class="dims" id="dims"></div>
    <div class="sty">
      <button type="button" class="q cbtn" id="cLine" data-k="line" data-ti="cLine" title="لون الخط"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20L20 4"/></svg><span class="cbar"></span></button>
      <select class="sel" id="wSel" data-ti="width" title="سماكة الخط"></select>
      <button type="button" class="q" id="dSolid" data-ti="solid" title="خط متصل"><svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path d="M3 12h18"/></svg></button>
      <button type="button" class="q" id="dDash" data-ti="dash" title="خط متقطع"><svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-dasharray="4 3"><path d="M3 12h18"/></svg></button>
      <span class="sep"></span>
      <button type="button" class="q cbtn" id="cFill" data-k="fill" data-ti="cFill" title="التعبئة"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 12l7-7 7 7-7 7z"/></svg><span class="cbar"></span></button>
      <button type="button" class="q cbtn" id="cText" data-k="text" data-ti="cText" title="لون الكتابة"><b>أ</b><span class="cbar"></span></button>
      <button type="button" class="q cbtn" id="cMark" data-k="mark" data-ti="cMark" title="لون العلامات"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 19a12 12 0 0 1 8-12"/><path d="M5 19h14"/></svg><span class="cbar"></span></button>
      <select class="sel" id="fsSel" data-ti="fs" title="حجم الكتابة"></select>
    </div>
    <div class="sty">
      <button type="button" class="q" id="dgAr" data-ti="dgAr" title="أرقام هندية"><b style="font-size:11px">١٢</b></button>
      <button type="button" class="q" id="dgEn" data-ti="dgEn" title="أرقام إنجليزية"><b style="font-size:11px">12</b></button>
      <span class="sep"></span>
      <button type="button" class="q" id="nmText" data-ti="nmText" title="الأسماء حروف عادية"><b>أ</b></button>
      <button type="button" class="q" id="nmSym" data-ti="nmSym" title="الأسماء رموزًا"><b style="font-family:'Mazeri Arabic Math symbol';font-weight:400;font-size:17px">A</b></button>
      <span class="sep"></span>
      <button type="button" class="q" id="ptShow" data-ti="ptShow" title="النقاط على الرؤوس"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 19L12 5l7 14"/><circle cx="12" cy="5" r="2.6" fill="currentColor"/><circle cx="5" cy="19" r="2.6" fill="currentColor"/><circle cx="19" cy="19" r="2.6" fill="currentColor"/></svg></button>
      <button type="button" class="q cbtn" id="cPt" data-k="pt" data-ti="cPt" title="لون النقاط"><svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="11" r="5" fill="currentColor"/></svg><span class="cbar"></span></button>
      <select class="sel" id="ptSel" style="width:46px" data-ti="ptR" title="حجم النقطة"></select>
      <button type="button" class="q" id="ptFull" data-ti="ptFull" title="نقطة مغلقة"><svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="currentColor"/></svg></button>
      <button type="button" class="q" id="ptHollow" data-ti="ptHollow" title="نقطة مفرغة"><svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></button>
    </div>
  </div>

let LANG='ar';
try{ LANG=localStorage.getItem('uula-geometry-lang')||localStorage.getItem('tk-lang')||'ar'; }catch(e){}
if(LANG!=='en') LANG='ar';
const L=k=>{ const v=T[k]; return v?(LANG==='en'?v[1]:v[0]):k; };

/* ---------- أدوات رياضية ---------- */
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1]], mul=(a,k)=>[a[0]*k,a[1]*k];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1], crs=(a,b)=>a[0]*b[1]-a[1]*b[0], len=a=>Math.hypot(a[0],a[1]);
const nrm=a=>{ const l=len(a)||1; return [a[0]/l,a[1]/l]; }, perp=a=>[-a[1],a[0]], mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI, ang=v=>deg(Math.atan2(v[1],v[0]));
const rot=(p,c,d)=>{ const r=rad(d), s=Math.sin(r), k=Math.cos(r), v=sub(p,c); return [c[0]+v[0]*k-v[1]*s, c[1]+v[0]*s+v[1]*k]; };

const proj=(p,a,b)=>{ const d=nrm(sub(b,a)); return add(a,mul(d,dot(sub(p,a),d))); };
const lineX=(p,d,a,b)=>{ const e=sub(b,a), den=crs(d,e); if(Math.abs(den)<1e-9) return null; const t=crs(sub(a,p),e)/den; return add(p,mul(d,t)); };
const AR='٠١٢٣٤٥٦٧٨٩';

// الأرقام في الرسم: هندية (٠١٢) أو إنجليزية (012) حسب الاختيار
const digits=s=>(S&&S.look&&S.look.digits==='en')?String(s).replace(/[٠-٩]/g,d=>AR.indexOf(d)).replace(/٫/g,'.'):String(s).replace(/[0-9]/g,d=>AR[d]).replace(/(\d|[٠-٩])\.(?=[0-9٠-٩])/g,'$1٫');
const fmtLen=v=>arNum(Math.round(v*10)/10)+' سم';
const fmtAng=v=>arNum(Math.round(v))+'°';
const clone=o=>JSON.parse(JSON.stringify(o));
const NAMES=['أ','ب','ج','د','هـ','و','ز','ح','ط','ي','ك','ل','م','ن','س','ع'];
// أسماء الرؤوس رموزًا: خط Mazeri Arabic Math symbol يرسم الحروف الرياضية على مفاتيح لاتينية
const SYMFONT='Mazeri Arabic Math symbol';
const SYM={'أ':'A','ا':'A','ب':'B','ت':'C','ث':'D','جـ':'E','ج':'F','خ':'G','ح':'H','د':'I','ر':'K','ز':'M','ذ':'N','س':'O','ش':'P','ص':'Q','ض':'R','ط':'S','ظ':'T','ع':'U','غ':'V','ف':'W','ق':'X','ك':'Y','ل':'Z','م':'\\','ن':']','هـ':'`','ه':'`','و':'a','ي':'b'};

/* ---------- الحالة ---------- */
const TRI={ sca:[[120,40],[55,205],[265,205]], iso:[[160,32],[70,205],[250,205]], equ:[[160,49],[70,205],[250,205]], rt:[[75,40],[75,205],[255,205]] };
const BASE={ sq:[[85,45],[85,205],[245,205],[245,45]], rect:[[50,65],[50,190],[270,190],[270,65]], para:[[105,60],[50,190],[215,190],[270,60]],
  rho:[[160,28],[85,125],[160,222],[235,125]], trap:[[105,60],[50,195],[270,195],[215,60]] };
function polyPts(n){ const c=[160,128], r=n<=4?92:98, P=[]; for(let k=0;k<n;k++){ const a=rad(-90-k*360/n); P.push([c[0]+r*Math.cos(a), c[1]+r*Math.sin(a)]); } return P; }
function shapePts(kind,sub,n){ if(kind==='tri') return clone(TRI[sub]); if(kind==='poly') return polyPts(n); return clone(BASE[kind]); }
function mkPlane(kind,sub,n){ const P=shapePts(kind,sub,n);
  return { kind, sub, n, pts:P,
    sides:P.map(()=>({len:'',show:false,ticks:0,par:0,dash:false})),
    verts:P.map((_,i)=>({name:NAMES[i],showName:true,ang:'',showAng:false,arc:false,arcs:0,right:false,alt:false,med:false,bis:false,sym:'',num:'',dir:''})),
    diag:false };
}
// الشكل المركب: نقاط حرة وقطع بينها وزوايا عند أي نقطة
function mkFree(P,segs){ return { kind:'free', sub:'', n:P.length, pts:P.map(p=>p.slice()), verts:P.map((_,i)=>({name:NAMES[i]||'',showName:true})),
  sides:segs.map(([a,b])=>({a,b,len:'',show:false,ticks:0,par:0,dash:false})), angs:{}, on:{}, diag:false }; }
const angKey=(i,a,b)=>i+':'+Math.min(a,b)+'-'+Math.max(a,b);
function freeNb(G,i){ const nb=[]; G.sides.forEach(s=>{ if(s.a===i) nb.push(s.b); else if(s.b===i) nb.push(s.a); }); return nb; }
function freeAngles(G,i){ const P=G.pts, nb=freeNb(G,i).map(j=>({j,a:((ang(sub(P[j],P[i]))%360)+360)%360})).sort((x,y)=>x.a-y.a);
  if(nb.length<2) return []; if(nb.length===2) return [[nb[0].j,nb[1].j]];
  const out=[]; for(let k=0;k<nb.length;k++){ const x=nb[k], y=nb[(k+1)%nb.length], sw=((y.a-x.a)%360+360)%360; if(sw>1&&sw<178) out.push([x.j,y.j]); } return out; }
function defaults(){
  return { v:1, tab:'p', hide:{}, nm:{},
    p:mkPlane('tri','iso',6),

        size:{cube:{w:130},box:{w:180,h:105,d:130},prism:{w:170,h:120,d:150},pyr:{w:170,h:150,d:150},cyl:{r:75,h:150},cone:{r:80,h:170},sph:{r:92}},
        lab:{cube:{w:'٤ سم'},box:{w:'٦ سم',h:'٣ سم',d:'٤ سم'},prism:{w:'٥ سم',h:'٤ سم',d:'٨ سم'},pyr:{w:'٦ سم',h:'ع'},cyl:{r:'نق',h:'ع'},cone:{r:'نق',h:'ع',l:'ل'},sph:{r:'نق'}} },
    look:{ line:'#000000', w:2, dash:false, fill:null, text:'#000000', mark:'#000000', fs:12, fsDef:1, pt:'#000000', ptShow:false, ptR:3, ptFill:true, names:'sym', symDef:1, digits:'ar' } };
}
let S=defaults();
try{ const t=localStorage.getItem('uula-geometry-state-v1'); if(t){ const o=JSON.parse(t); if(o&&o.v===1){ const d=defaults(); S=Object.assign(d,o); S.look=Object.assign(defaults().look,o.look||{}); if(!(o.look||{}).symDef){ S.look.names='sym'; S.look.symDef=1; } if(!(o.look||{}).fsDef){ S.look.fs=12; S.look.fsDef=1; } S.hide=o.hide||{}; S.nm=o.nm||{}; } } }catch(e){}
function save(){ try{ localStorage.setItem('uula-geometry-state-v1',JSON.stringify(S)); }catch(e){} }
let HIST=[]; const push=()=>{ HIST.push(JSON.stringify(S)); if(HIST.length>60) HIST.shift(); };
function undo(){ if(!HIST.length) return; S=JSON.parse(HIST.pop()); closePop(); syncUI(); draw(); save(); }

/* ---------- العناصر الأولية للرسم ----------
   seg {a,b,c,w,dash} · ell {c,rx,ry,a0,a1,c,w,dash}(قوس أو كاملة) · pie {c,r,a0,a1,fill} · poly {pts,fill} · txt {p,s,c,fs} · dot {p,r,c} */
let PR=[], AUX=0;
const LK=()=>S.look;
function seg(a,b,o){ o=o||{}; PR.push({t:'seg',a,b,c:o.c||LK().line,w:o.w||LK().w,dash:o.dash!=null?o.dash:LK().dash}); }
function aux(a,b){ seg(a,b,{dash:true,w:Math.max(1,LK().w*.75)}); }
function mk(a,b){ seg(a,b,{c:LK().mark,w:Math.max(1,LK().w*.7),dash:false}); }
function arcP(c,r,a0,a1,o){ o=o||{}; PR.push({t:'ell',c,rx:r,ry:o.ry||r,a0,a1,c2:o.c||LK().mark,w:o.w||Math.max(1,LK().w*.7),dash:!!o.dash}); }
function txt(p,s,o){ if(s==null||s==='') return; o=o||{}; PR.push({t:'txt',p,s:digits(String(s)),c:o.c||LK().text,fs:o.fs||LK().fs,from:o.from}); }
// كتابة يعتبرها المستخدم اسمًا (طول ضلع، زاوية): الحرف الواحد يُكتب رمزًا إذا كانت الأسماء رموزًا، والرقم وحده في الزاوية يأخذ °
function lbl(p,s,o){ if(s==null||s==='') return; o=o||{}; const k=String(s).trim();
  if(LK().names==='sym'&&SYM[k]){ PR.push({t:'txt',p,s:SYM[k],c:LK().text,fs:(o.fs||LK().fs)*1.1,font:SYMFONT,from:o.from}); return; }
  if(o.deg&&/^[0-9\u0660-\u0669.,٫]+$/.test(k)){ const v=parseFloat(k.replace(/[\u0660-\u0669]/g,d=>d.charCodeAt(0)-0x660).replace(/[٫,]/g,'.')); if(isFinite(v)){ txt(p,fmtAng(v),o); return; } }
  txt(p,s,o); }
function nm(p,s,from){ if(s==null||s==='') return; const k=String(s).trim(); if(LK().names==='sym'&&SYM[k]) PR.push({t:'txt',p,s:SYM[k],c:LK().text,fs:LK().fs*1.1,font:SYMFONT,from}); else txt(p,s,{from}); }
function dotP(p,o){ o=o||{}; const L2=LK(); PR.push({t:'dot',p,r:o.r||L2.ptR,c:o.c||L2.pt||L2.line,fill:L2.ptFill,w:Math.max(1,L2.w*.6)}); }
// نقطة الرأس: لكل رأس أن يخالف الإعداد العام (إظهار، لون، حجم)
function ptP(p,V){ const on=V&&V.pt!=null?V.pt:LK().ptShow; if(on) dotP(p,V?{c:V.pc,r:V.pr}:null); }
// نمط خط الضلع: متصل أو متقطع أو منقط (الضلع يخالف الإعداد العام إن حُدد له نمط)
function segDash(sd){ if(sd.ls==='dot') return 'dot'; if(sd.ls==='solid') return false; return !!(sd.ls==='dash'||sd.dash||LK().dash); }
// زاوية بين اتجاهين من نقطة، بالاتجاه الأصغر (أقل من 180)
function angSpan(P,A,B){ let a0=ang(sub(A,P)), a1=ang(sub(B,P)); let sw=((a1-a0)%360+360)%360; if(sw>180){ const t=a0; a0=a1; a1=t; sw=360-sw; } return {a0,a1:a0+sw,sw}; }

// رمز داخل الزاوية: نجمة أو نقطة، ورقم يُسمّي الزاوية. يعيد المسافة التي استُخدمت
function angleSym(p,A,B,sym,num,r0){ const s=angSpan(p,A,B), bi=rad((s.a0+s.a1)/2), u=[Math.cos(bi),Math.sin(bi)], fs=LK().fs, extra=s.sw<50?8:0; let r=Math.max(r0+7,17)+extra;

// رأس سهم مملوء عند نقطة باتجاه معيّن

// الزاوية الموجهة: قوس عليه سهم، باتجاه عقارب الساعة (cw) أو عكسها (ccw)

  else { const a=rad(s.a0); arrowHead([p[0]+r*Math.cos(a),p[1]+r*Math.sin(a)],[Math.sin(a),-Math.cos(a)]); } }
// سهم على طرف القطعة
function segArrows(a,b,arr,c){ if(!arr) return; const d=nrm(sub(b,a)); if(arr&1) arrowHead(b,d,c||LK().line); if(arr&2) arrowHead(a,mul(d,-1),c||LK().line); }
function rightMark(P,A,B,s){ s=s||11; const u=mul(nrm(sub(A,P)),s), v=mul(nrm(sub(B,P)),s); mk(add(P,u),add(add(P,u),v)); mk(add(add(P,u),v),add(P,v)); }

function buildFree(){

  G.sides.forEach(sd=>{ const a=P[sd.a], b=P[sd.b], both=sd.ticks&&sd.par; sideTicks(a,b,sd.ticks,both?-9:0); parMarks(a,b,sd.par,both?9:0);

    if(A.right) rightMark(p,P[a],P[b]); let r0=18; if(A.arcs){ angleArcs(p,P[a],P[b],A.arcs,18); r0=18+A.arcs*4.5; } else if((A.arc||A.showAng)&&!A.right){ angleArcs(p,P[a],P[b],1,16); r0=20; }
    if(A.dir){ const rr=Math.max(r0+6,26); angleArrow(p,P[a],P[b],A.dir,rr); r0=rr+4; }
    if(A.sym||A.num) r0=angleSym(p,P[a],P[b],A.sym,A.num,A.right?12:r0)-fs*.5;
    if(A.showAng){ const s=angSpan(p,P[a],P[b]), bi=rad((s.a0+s.a1)/2), rr=r0+fs*.95+(s.sw<45?10:0); lbl(add(p,[Math.cos(bi)*rr,Math.sin(bi)*rr]),A.ang||fmtAng(s.sw),{fs:fs*.85,from:p,deg:1}); } });

}
function buildPlane(){
  if(S.p.kind==='free') return buildFree();
  const G=S.p, P=G.pts, n=P.length, fs=LK().fs, C=cen(P);
  let nextName=n;
  const newName=()=>NAMES[nextName++]||'';
  if(LK().fill) PR.push({t:'poly',pts:P.map(p=>p.slice()),fill:LK().fill});
  for(let i=0;i<n;i++){ const sd=G.sides[i]; seg(P[i],P[(i+1)%n],{c:sd.c,w:sd.w,dash:segDash(sd)}); segArrows(P[i],P[(i+1)%n],sd.arr,sd.c); }
  if(G.diag&&n===4){ aux(P[0],P[2]); aux(P[1],P[3]); const X=lineX(P[0],sub(P[2],P[0]),P[1],P[3]); if(X&&G.verts[0].showName) lab2(X,add(X,[0,fs*.95]),'p:x',newName()); }
  const FEET=feetList(G);
  // علامات الأضلاع
  for(let i=0;i<n;i++){ const sd=G.sides[i], a=P[i], b=P[(i+1)%n];
    const both=sd.ticks&&sd.par; sideTicks(a,b,sd.ticks,both?-9:0); parMarks(a,b,sd.par,both?9:0);
    if(sd.show){ const m=mid(a,b); let nn=perp(nrm(sub(b,a))); if(dot(nn,sub(m,C))<0) nn=mul(nn,-1); let lp=m; if(FEET.some(f=>len(sub(f,m))<fs*2)){ const d=nrm(sub(b,a)), sh=Math.min(len(sub(b,a))*.28,fs*2.6); lp=add(m,mul(d,FEET.some(f=>dot(sub(f,m),d)>0)?-sh:sh)); }
    lbl(add(lp,mul(nn,fs*1.1)),sd.len||fmtLen(len(sub(b,a))/40),{from:lp}); } }
  // الرؤوس
  FEET.forEach(f=>ptP(f));
  for(let i=0;i<n;i++){ const V=G.verts[i], p=P[i], a=P[(i-1+n)%n], b=P[(i+1)%n]; ptP(p,V);
    if(V.right) rightMark(p,a,b);
    let r0=18; if(V.arcs){ angleArcs(p,a,b,V.arcs,18); r0=18+V.arcs*4.5; } else if((V.showAng||V.arc)&&!V.right){ angleArcs(p,a,b,1,16); r0=20; }
    if(V.dir){ const rr=Math.max(r0+6,26); angleArrow(p,a,b,V.dir,rr); r0=rr+4; }
    if(V.sym||V.num) r0=angleSym(p,a,b,V.sym,V.num,V.right?12:r0)-fs*.5;
    if(V.showAng){ const s=angSpan(p,a,b), bi=rad((s.a0+s.a1)/2); const rr=r0+fs*.95+(s.sw<45?10:0); lbl(add(p,[Math.cos(bi)*rr,Math.sin(bi)*rr]),V.ang||fmtAng(s.sw),{fs:fs*.85,from:p,deg:1}); }
    if(V.showName) nm(add(p,mul(outward(P,i),fs*1.05)),V.name,p);
  }
  // الارتفاع والمتوسط والمنصف (المثلث: إلى الضلع المقابل؛ الرباعي: من الرأس إلى ب ج)
  for(let i=0;i<n;i++){ const V=G.verts[i]; if(!(V.alt||V.med||V.bis)) continue;
    let A,B; if(n===3){ A=P[(i+1)%3]; B=P[(i+2)%3]; } else { A=P[(i+1)%n]; B=P[(i+2)%n]; }

      if(len(sub(F,A))>8&&len(sub(F,B))>8&&V.showName){ let d=nrm(sub(F,p)); lab2(F,add(F,mul(d,fs*.95)),'p:alt'+i,newName()); } }

    if(V.bis&&n===3){ const s=angSpan(p,A,B), bi=rad((s.a0+s.a1)/2), d=[Math.cos(bi),Math.sin(bi)], D=lineX(p,d,A,B);
      if(D){ aux(p,D); const h=s.sw/2; arcP(p,24,s.a0,s.a0+h); arcP(p,24,s.a0+h,s.a1);
        [s.a0+h/2,s.a0+h*1.5].forEach(a=>{ const u=[Math.cos(rad(a)),Math.sin(rad(a))]; mk(add(p,mul(u,20)),add(p,mul(u,28))); });
        if(V.showName){ const dd=nrm(sub(D,p)); lab2(D,add(D,mul(dd,fs*.95)),'p:bis'+i,newName()); } } }
  }
}

function feetList(G){ const P=G.pts, n=P.length, out=[];
  G.verts.forEach((V,i)=>{ const A=P[(i+1)%n], B=P[(i+2)%n], p=P[i];
    if(V.alt) out.push(proj(p,A,B)); if(V.med&&n===3) out.push(mid(A,B));
    if(V.bis&&n===3){ const s=angSpan(p,A,B), bi=rad((s.a0+s.a1)/2), D=lineX(p,[Math.cos(bi),Math.sin(bi)],A,B); if(D) out.push(D); } });
  if(G.diag&&n===4){ const X=lineX(P[0],sub(P[2],P[0]),P[1],P[3]); if(X) out.push(X); }
  return out; }
/* ---------- الدائرة ---------- */
function buildCircle(){
  const K=S.c, c=K.c, r=K.r, sh=K.show, fs=LK().fs, A=K.a;
  const P=k=>[c[0]+r*Math.cos(rad(A[k])), c[1]+r*Math.sin(rad(A[k]))];
  const lab=(k,name)=>{ ptP(P(k)); if(!sh.names) return; const d=[Math.cos(rad(A[k])),Math.sin(rad(A[k]))]; lab2(P(k),add(c,mul(d,r+fs*.9)),'c:'+k,name); };
  const swGH=(((A.G-A.H)%360)+360)%360;
  if(sh.sector) PR.push({t:'pie',c,r,a0:A.H,a1:A.H+swGH,fill:LK().fill||'#cfe0f8'});
  PR.push({t:'ell',c,rx:r,ry:r,a0:0,a1:360,c2:LK().line,w:LK().w,dash:LK().dash,fill:sh.sector?null:LK().fill});
  if(sh.arc) PR.push({t:'ell',c,rx:r,ry:r,a0:A.H,a1:A.H+swGH,c2:LK().mark,w:LK().w*1.8,dash:false});
  if(sh.center){ dotP(c); if(sh.names) lab2(c,add(c,[fs*.7,fs*.75]),'c:C','م'); }
  if(sh.radius){ seg(c,P('A')); if(sh.meas) txt(add(mid(c,P('A')),mul(perp(nrm(sub(P('A'),c))),-fs*.8)),'نق',{fs:fs*.85}); lab('A','أ'); }
  if(sh.diam){ seg(P('B'),[2*c[0]-P('B')[0],2*c[1]-P('B')[1]]); const opp=A.B+180; lab('B','ب'); ptP([2*c[0]-P('B')[0],2*c[1]-P('B')[1]]); if(sh.names){ const d=[Math.cos(rad(opp)),Math.sin(rad(opp))]; lab2(add(c,mul(d,r)),add(c,mul(d,r+fs*.9)),'c:B2','ج'); } }
  if(sh.chord){ seg(P('D'),P('E')); lab('D','د'); lab('E','هـ'); }
  if(sh.tangent){ const p=P('F'), d=perp([Math.cos(rad(A.F)),Math.sin(rad(A.F))]), L2=r*.85; seg(add(p,mul(d,L2)),sub(p,mul(d,L2))); rightMark(p,c,add(p,d),9); aux(c,p); if(!LK().ptShow) dotP(p); lab('F','و'); }
  const needGH=sh.arc||sh.sector||sh.central||sh.inscribed;
  if(sh.sector||sh.central){ seg(c,P('G')); seg(c,P('H')); }
  if(sh.central){ const s=angSpan(c,P('G'),P('H')); arcP(c,18,s.a0,s.a1); if(sh.meas){ const bi=rad((s.a0+s.a1)/2); txt(add(c,[Math.cos(bi)*(30+fs*.4),Math.sin(bi)*(30+fs*.4)]),fmtAng(s.sw),{fs:fs*.85}); } }
  if(sh.inscribed){ const v=P('I'); seg(v,P('G')); seg(v,P('H')); const s=angSpan(v,P('G'),P('H')); arcP(v,18,s.a0,s.a1); lab('I','ط');
    if(sh.meas){ const bi=rad((s.a0+s.a1)/2); txt(add(v,[Math.cos(bi)*(30+fs*.4),Math.sin(bi)*(30+fs*.4)]),fmtAng(s.sw),{fs:fs*.85}); } }
  if(needGH){ lab('G','ز'); lab('H','ح'); }
}

/* ---------- المجسمات (إسقاط مائل) ---------- */
const KX=.42*Math.cos(rad(38)), KY=.42*Math.sin(rad(38));
function rotAbout(q,c,deg){ const a=rad(deg), cs=Math.cos(a), sn=Math.sin(a), x=q[0]-c[0], y=q[1]-c[1]; return [c[0]+x*cs-y*sn, c[1]+x*sn+y*cs]; }
const VIEW=[-KX,-KY,1];

      let n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]]; const fc=f.reduce((s,i)=>[s[0]+V3[i][0],s[1]+V3[i][1],s[2]+V3[i][2]],[0,0,0]).map(x=>x/f.length);

      else { const bc=mid(P2[0],P2[2]); aux(P2[4],bc); dotP(bc); txt(add(mid(P2[4],bc),[fs*.8,0]),lb.h); txt(add(mid(P2[0],P2[1]),[0,fs*1.05]),lb.w); }
    }

  }
  // الأجسام الدورانية
  const r=sz.r, ry=r*(sz.e||.32), H=k==='sph'?0:sz.h, rot=(Z.rot&&Z.rot[k])||0, i0=PR.length;

// يبني الشكل في الشريحة أشكالاً عادية مجمّعة
let GROUP_MADE=false;
async function insertNative(pr,json,bb,slideId){
  GROUP_MADE=false;
  await PowerPoint.run(async ctx=>{
    const shapes=slideId?ctx.presentation.slides.getItem(slideId).shapes:ctx.presentation.getSelectedSlides().getItemAt(0).shapes;
    let ox=60, oy=60, sc=1;
    let PL=null;
    if(EDIT&&EDIT.place){ PL=EDIT.place; sc=PL.a; }
    else if(EDIT){ ox=EDIT.left; oy=EDIT.top; sc=EDIT.w?EDIT.width/EDIT.w:1; }
    else { const ss=ctx.presentation.getSelectedShapes(); ss.load('items/left,items/top,items/width'); shapes.load('items/name'); await ctx.sync();
      if(ss.items.length){ const s=ss.items[0]; ox=s.left+s.width+20; oy=s.top; }
      else { // وسط الشريحة، وكل شكل جديد يُزاح قليلاً عن السابق حتى لا يغطيه
        let W=960, H=540; try{ const ps=ctx.presentation.pageSetup; ps.load('slideWidth,slideHeight'); await ctx.sync(); if(ps.slideWidth) { W=ps.slideWidth; H=ps.slideHeight; } }catch(e){}
        const n=shapes.items.filter(s=>s.name===TITLE).length; ox=Math.max(10,(W-bb.w)/2)+n*24; oy=Math.max(10,(H-bb.h)/2)+n*24; } }
    const X=PL?(x=>PL.bx+x*PL.a):(x=>ox+(x-bb.x)*sc), Y=PL?(y=>PL.by+y*PL.a):(y=>oy+(y-bb.y)*sc), made=[], arcs=[], tris=[];
    const line=(sh,c,w,dash)=>{ sh.lineFormat.visible=true; sh.lineFormat.color=c; sh.lineFormat.weight=w; sh.lineFormat.dashStyle=dash==='dot'?'RoundDot':dash?'Dash':'Solid'; };
    const tri=(A,B,Cc,fill)=>{ // مثلث بأي زوايا: شكل المثلث مع مقبض الرأس ودوران
      const P=[A,B,Cc]; let bi=0,bl=0; for(let i=0;i<3;i++){ const l=len(sub(P[(i+1)%3],P[i])); if(l>bl){ bl=l; bi=i; } }
      let Q0=P[bi], Q1=P[(bi+1)%3]; const R=P[(bi+2)%3]; let u=nrm(sub(Q1,Q0)), nv=[u[1],-u[0]];
      if(dot(sub(R,Q0),nv)<0){ const t=Q0; Q0=Q1; Q1=t; u=mul(u,-1); nv=[u[1],-u[0]]; }
      const b=bl, h=Math.max(.5,dot(sub(R,Q0),nv)), t=Math.max(0,Math.min(1,dot(sub(R,Q0),u)/b));
      const c=add(add(Q0,mul(u,b/2)),mul(nv,h/2));
      const s=shapes.addGeometricShape('Triangle',{left:X(c[0])-b*sc/2,top:Y(c[1])-h*sc/2,width:b*sc,height:h*sc});
      s.rotation=normA(ang(u)); s.fill.setSolidColor(fill); line(s,fill,.5,false); made.push(s); tris.push({s,t}); };
    for(const p of pr){
      if(p.t==='seg'){ let a=[X(p.a[0]),Y(p.a[1])], b=[X(p.b[0]),Y(p.b[1])]; const dx=b[0]-a[0], dy=b[1]-a[1]; let s;
        if(dx*dy<0){ const c=mid(a,b), W=Math.max(.01,Math.abs(dy)), H=Math.max(.01,Math.abs(dx)); s=shapes.addLine('Straight',{left:c[0]-W/2,top:c[1]-H/2,width:W,height:H}); s.rotation=90; }
        else s=shapes.addLine('Straight',{left:Math.min(a[0],b[0]),top:Math.min(a[1],b[1]),width:Math.max(.01,Math.abs(dx)),height:Math.max(.01,Math.abs(dy))});
        line(s,p.c,p.w,p.dash); made.push(s); }
      else if(p.t==='ell'){ const full=p.a1-p.a0>=359.99, box={left:X(p.c[0]-p.rx),top:Y(p.c[1]-p.ry),width:2*p.rx*sc,height:2*p.ry*sc};
        const s=shapes.addGeometricShape(full?'Ellipse':'Arc',box); if(full&&p.fill) s.fill.setSolidColor(p.fill); else s.fill.clear(); line(s,p.c2,p.w,p.dash); if(p.rot){ try{ s.rotation=((p.rot%360)+360)%360; }catch(e){} } made.push(s); if(!full) arcs.push({s,a0:p.a0,a1:p.a1}); }
      else if(p.t==='pie'){ const s=shapes.addGeometricShape('Pie',{left:X(p.c[0]-p.r),top:Y(p.c[1]-p.r),width:2*p.r*sc,height:2*p.r*sc}); s.fill.setSolidColor(p.fill); s.lineFormat.visible=false; made.push(s); arcs.push({s,a0:p.a0,a1:p.a1}); }
      else if(p.t==='poly'){ for(let i=1;i<p.pts.length-1;i++) tri(p.pts[0],p.pts[i],p.pts[i+1],p.fill); }
      else if(p.t==='dot'){ const s=shapes.addGeometricShape('Ellipse',{left:X(p.p[0]-p.r),top:Y(p.p[1]-p.r),width:2*p.r*sc,height:2*p.r*sc});
        if(p.fill===false){ s.fill.setSolidColor('#ffffff'); line(s,p.c,p.w,false); } else { s.fill.setSolidColor(p.c); s.lineFormat.visible=false; } made.push(s); }
      else if(p.t==='txt'){ const w=p.fs*(.62*Math.max(1,p.s.length)+1.2), h=p.fs*1.5;
        // بُعد الاسم عن الخط بالنقاط كما في المعاينة، لأن الخط لا يُصغَّر مع الشكل
        const tx=p.from?X(p.from[0])+(p.p[0]-p.from[0])*Math.max(1,sc):X(p.p[0]), ty=p.from?Y(p.from[1])+(p.p[1]-p.from[1])*Math.max(1,sc):Y(p.p[1]);
        const s=shapes.addTextBox(p.s,{left:tx-w/2,top:ty-h/2,width:w,height:h}); const tf=s.textFrame;
        tf.wordWrap=false; tf.autoSizeSetting='AutoSizeNone'; tf.leftMargin=0; tf.rightMargin=0; tf.topMargin=0; tf.bottomMargin=0; tf.verticalAlignment='Middle';
        tf.textRange.font.name=p.font||'UULA Sans'; tf.textRange.font.size=p.fs; tf.textRange.font.color=p.c; tf.textRange.paragraphFormat.horizontalAlignment='Center';

    }
    await ctx.sync();
    // معايرة وحدة المقابض من القيم الافتراضية (القوس يبدأ عند 270°، والمثلث رأسه في المنتصف)
    if(arcs.length){ let probe=null;
      const tmp=shapes.addGeometricShape('Arc',{left:0,top:0,width:10,height:10}); const v=tmp.adjustments.get(0); await ctx.sync(); probe=v.value; tmp.delete();
      const big=Math.abs(probe)>1000, neg=probe<0, k=big?60000:1;
      const conv=a=>{ let x=normA(a); if(neg&&x>180) x-=360; return x*k; };
      arcs.forEach(a=>{ a.s.adjustments.set(0,conv(a.a0)); a.s.adjustments.set(1,conv(a.a1)); }); }
    if(tris.length){ const v=tris[0].s.adjustments.get(0); await ctx.sync(); const k=(v.value||.5)/.5; tris.forEach(o=>o.s.adjustments.set(0,o.t*k)); }
    made.forEach(s=>s.load('id')); await ctx.sync();
    const g=shapes.addGroup(made.map(s=>s.id)); g.name=TITLE; g.tags.add(TAG,json); g.load('id'); await ctx.sync(); GROUP_MADE=true;
    if(EDIT){ const old=shapes.getItemOrNullObject(EDIT.id); await ctx.sync();
      // الصورة الأصلية لا تُحذف: تُنقل خارج الشريحة إلى يسارها للمراجعة
      if(!old.isNullObject){ if(EDIT.pic){
          if(EDIT.legacy){ const lg=shapes.getItemOrNullObject(EDIT.legacy); await ctx.sync(); if(!lg.isNullObject) lg.delete(); old.tags.add('UULA_GEO_SRC',JSON.stringify({left:EDIT.left,top:EDIT.top})); }
          if(EDIT.redo){ shapes.load('items/id'); await ctx.sync(); const prev=shapes.items.map(x=>({x,t:x.tags.getItemOrNullObject('UULA_GEO_FROM')})); prev.forEach(o=>o.t.load('value')); await ctx.sync();
            let hit=false; prev.forEach(o=>{ if(!o.t.isNullObject&&o.t.value===String(EDIT.id)&&o.x.id!==g.id){ o.x.delete(); hit=true; } });
            if(!hit&&EDIT.near&&EDIT.near!==g.id){ const nr=shapes.getItemOrNullObject(EDIT.near); await ctx.sync(); if(!nr.isNullObject) nr.delete(); } }
          else { old.load('width'); await ctx.sync(); old.tags.add('UULA_GEO_SRC',JSON.stringify({left:EDIT.left,top:EDIT.top})); old.left=-old.width-20; }
          g.tags.add('UULA_GEO_FROM',String(EDIT.id)); }
        else old.delete(); await ctx.sync(); }
      g.load('id'); await ctx.sync(); EDIT.id=g.id; }
  });
}

    const s=shapes.items[shapes.items.length-1]; s.name=TITLE; s.tags.add(TAG,json);

    if(cp.tangent!=null){ sh.tangent=true; A.F=Math.round(cp.tangent); }
    sh.names=r.texts.length>0; }
  else if(r.type==='solid'){ S.tab='s'; const Z=S.s, k=r.kind; Z.kind=k; Z.names=false; Z.dims=false; Z.centers=false; Z.hidden=r.hidden; Z.ax=Z.ax||{}; Z.rot=Z.rot||{};
    if(k==='cyl'){ const s=Math.min(1.6,Math.min(250,195)/Math.max(2*r.r,r.h+2*r.r*r.e,1)); fit={s,cx:r.c[0],cy:r.c[1]}; Z.size.cyl=Object.assign({},Z.size.cyl,{r:r.r*s,h:r.h*s,e:r.e}); Z.rot.cyl=r.rot; }
    else { const s0=Math.min(260/Math.max(1,r.w+r.d),195/Math.max(1,r.h+r.d)), s=Math.min(1.6,s0); fit={s,cx:r.c[0],cy:r.c[1]};
      Z.size[k]=Object.assign({},Z.size[k],{w:r.w*s,h:r.h*s,d:r.d*s}); if(k==='prism') Z.size.prism.px=r.px; // جهة الرؤية: الوجه الأمامي z=0 (المرسوم كاملًا) ظاهر
      Z.ax[k]=Object.assign({},r.ax,{s:-Math.sign(crs(r.ax.x,r.ax.y))||1}); } }
  else if((r.type==='lines'&&(FREE0=r.G))||(r.type==='poly'&&(FREE0=r.alt||compose(r,classify(r))))){ const G=FREE0, bb=bboxPts(G.pts.concat(...(G.circles||[]).map(o=>[[o.c[0]-o.r,o.c[1]-o.r],[o.c[0]+o.r,o.c[1]+o.r]]))), s=Math.min(260/bb.w,195/bb.h), cxi=bb.x+bb.w/2, cyi=bb.y+bb.h/2; fit={s,cx:cxi,cy:cyi};
    G.pts=G.pts.map(p=>[160+(p[0]-cxi)*s,122+(p[1]-cyi)*s]); (G.circles||[]).forEach(o=>{ o.c=[160+(o.c[0]-cxi)*s,122+(o.c[1]-cyi)*s]; o.r*=s; }); S.tab='p'; S.p=G; FT='move'; }
  else { const c0=classify(r), c=idealize(c0), bb=bboxPts(c.pts), s=Math.min(260/bb.w,195/bb.h), cxi=bb.x+bb.w/2, cyi=bb.y+bb.h/2; fit={s,cx:cxi,cy:cyi};
    const G=mkPlane(c.kind,c.sub,c.pts.length); G.pts=c.pts.map(p=>[160+(p[0]-cxi)*s,122+(p[1]-cyi)*s]);
    if(G.pts.length!==G.sides.length){ const g2=mkPlane('poly','iso',G.pts.length); g2.pts=G.pts; Object.assign(G,g2); }
    // خطوط داخلية مرسومة في الصورة
    const P0=c0.pts, n=P0.length;   // القياس على الرؤوس كما في الصورة قبل التصحيح
    if(n===4&&lineKind(r,P0[0],P0[2])&&lineKind(r,P0[1],P0[3])) G.diag=true;
    for(let i=0;i<n;i++){ const p=P0[i], a=P0[(i+1)%n], b=P0[(i+2)%n];
      if(n===3){ const F2=proj(p,a,b), M2=mid(a,b), far=q=>len(sub(q,a))>len(sub(b,a))*.1&&len(sub(q,b))>len(sub(b,a))*.1;
        if(far(F2)&&lineKind(r,p,F2)) G.verts[i].alt=true; else if(lineKind(r,p,M2)) G.verts[i].med=true;
        else { const s2=angSpan(p,a,b), bi=rad((s2.a0+s2.a1)/2), D2=lineX(p,[Math.cos(bi),Math.sin(bi)],a,b); if(D2&&lineKind(r,p,D2)) G.verts[i].bis=true; } }
      else if(n===4&&i===0&&(c.kind==='para'||c.kind==='trap')){ const F2=proj(p,a,b); if(lineKind(r,p,F2)) G.verts[0].alt=true; } }
    // العلامات: شرطات التساوي، رمز التوازي، الزاوية القائمة، أقواس الزوايا
    for(let i=0;i<n;i++){ const m=sideMarks(r,P0[i],P0[(i+1)%n]); G.sides[i].ticks=m.ticks; G.sides[i].par=m.par;
      if(n===3&&(G.verts[(i+2)%3].med||G.verts[(i+2)%3].alt)&&m.ticks===2) G.sides[i].ticks=0;
      const p=P0[i], a=P0[(i-1+n)%n], b=P0[(i+1)%n], V=G.verts[i];
      if(rightAt(r,p,a,b)) V.right=true; else { const k2=arcsAt(r,p,a,b); if(k2===1) V.arc=true; else if(k2>1) V.arcs=k2; } }
    // الأسماء والأطوال: تظهر حيث توجد كتابة بجانبها في الصورة
    const T2=r.texts.filter(x=>!inPoly(P0,x.c));
    if(T2.length){ const near=(q,R2)=>T2.some(x=>len(sub(x.c,q))<R2);
      for(let i=0;i<n;i++){ G.verts[i].showName=near(P0[i],r.fd*.13); const a=P0[i], b=P0[(i+1)%n], m=mid(a,b); G.sides[i].show=T2.some(x=>{ const dm=len(sub(x.c,m)); return dm<Math.max(r.fd*.12,len(sub(b,a))*.25)&&dm<len(sub(x.c,a))&&dm<len(sub(x.c,b)); }); } }
    S.tab='p'; S.p=G; }
  // يُدرج الشكل بلا أسماء ولا أطوال ولا قياسات: الأداة لا تقرأ الكتابة، فيضيفها المستخدم بنفسه
  // الصورة المحوَّلة: الخطوط والنقاط فقط، بلا أي علامة (المستخدم يضيف العلامات بنفسه)
  if(S.tab==='p'){ S.p.verts.forEach(v=>{ Object.assign(v,{showName:false,showAng:false,ang:'',arc:false,arcs:0,right:false,sym:'',num:'',dir:'',alt:false,med:false,bis:false}); });
    S.p.sides.forEach(sd=>{ Object.assign(sd,{show:false,len:'',ticks:0,par:0}); }); if(S.p.angs) S.p.angs={}; }
  else if(S.tab==='c'){ S.c.show.names=false; S.c.show.meas=false; }
  BG={src, x:160-fit.cx*fit.s, y:(S.tab==='p'?122:125)-fit.cy*fit.s, w:r.W*fit.s, h:(r.H||r.W*im.naturalHeight/im.naturalWidth)*fit.s};
  if(ed){ const e=Object.assign({},ed,{pic:true}); if(A&&!ed.word){ const a=A/fit.s; e.place={a, bx:ed.left+(fit.cx-160/fit.s)*A, by:ed.top+(fit.cy-(S.tab==='p'?122:125)/fit.s)*A}; } setEdit(e); }
  syncUI(); draw(); save();
  msg(ed&&!ed.word?L('picDone'):L('picDoneW'),'good');
  return r;
}
async function selectedPicture(){
  if(HOST==='PowerPoint'){ let out=null;
    await PowerPoint.run(async ctx=>{ const ss=ctx.presentation.getSelectedShapes(); ss.load('items/id,items/left,items/top,items/width,items/height'); await ctx.sync();
      if(!ss.items.length) throw L('picSel'); const s=ss.items[0], img=s.getImageAsBase64({format:'Png'}); await ctx.sync();
      const tg=s.tags.getItemOrNullObject('UULA_GEO_SRC'); tg.load('value'); await ctx.sync();
      out={src:'data:image/png;base64,'+img.value, ed:{id:s.id,left:s.left,top:s.top,width:s.width,height:s.height}};
      // صورة أصلية نُقلت سابقًا إلى يسار الشريحة: الشكل يعود إلى مكانها الأصلي ويحل محل الشكل السابق
      if(!tg.isNullObject){ let o=null; try{ o=JSON.parse(tg.value); }catch(e){}
        if(o&&o.left!=null){ out.ed.left=o.left; out.ed.top=o.top; out.ed.redo=true;
          // شكل سابق بلا وسم المصدر (تحويل قديم): أقرب شكل Geometry إلى المكان الأصلي يحل محله الشكل الجديد
          const sh=ctx.presentation.getSelectedSlides().getItemAt(0).shapes; sh.load('items/id,items/name,items/left,items/top,items/width,items/height'); await ctx.sync();
          const cx=o.left+s.width/2, cy=o.top+s.height/2; let best=null;
          sh.items.forEach(x=>{ if(x.name!==TITLE||x.left<0) return; const d=Math.hypot(x.left+x.width/2-cx,x.top+x.height/2-cy); if(d<Math.max(s.width,s.height)*.6&&(!best||d<best.d)) best={x,d}; });
          if(best) out.ed.near=best.x.id; }
        else { // تحويل قديم بلا موضع محفوظ: الشكل السابق على نفس الارتفاع يدل على المكان
          const sh=ctx.presentation.getSelectedSlides().getItemAt(0).shapes; sh.load('items/id,items/name,items/left,items/top,items/width,items/height'); await ctx.sync();
          const cy=s.top+s.height/2; let best=null; sh.items.forEach(x=>{ if(x.name!==TITLE||x.left<0) return; const d=Math.abs(x.top+x.height/2-cy); if(d<s.height*.6&&(!best||d<best.d)) best={x,d}; });
          if(best){ const x=best.x; out.ed.left=x.left+x.width/2-s.width/2; out.ed.top=x.top+x.height/2-s.height/2; out.ed.redo=true; out.ed.legacy=x.id; } } } });
    return out; }
  let out=null;
  await Word.run(async ctx=>{ const pics=ctx.document.getSelection().inlinePictures; pics.load('items'); await ctx.sync(); if(!pics.items.length) throw L('picSel');
    const b=pics.items[0].getBase64ImageSrc(); await ctx.sync(); out={src:'data:image/png;base64,'+b.value, ed:{word:true}}; });
  return out;
}
const fromPic=async()=>{ if(!HOST){ $('picFile').value=''; $('picFile').click(); return; }
  if(await loadSelected(true)) return;   // شكل من الأداة: تعديل لا تحويل
  try{ const s=await selectedPicture(); await pictureToShape(s.src,s.ed); }catch(e){ console.error(e); msg(typeof e==='string'?e:L('picFail'),'bad'); } };
$('fromPicItem').addEventListener('click',fromPic); $('picBtn').addEventListener('click',fromPic);
// تحويل دفعة: كل صور الأشكال في الشريحة أو العرض، والأصل يُنقل إلى يسار الشريحة
async function convertPictures(all){ if(HOST!=='PowerPoint') return; let list=[], SH=540;
  await PowerPoint.run(async ctx=>{ try{ const ps=ctx.presentation.pageSetup; ps.load('slideHeight'); await ctx.sync(); if(ps.slideHeight) SH=ps.slideHeight; }catch(e){}
    const sl=all?ctx.presentation.slides:ctx.presentation.getSelectedSlides(); sl.load('items/id'); await ctx.sync();
    const shs=sl.items.map(x=>{ const c=x.shapes; c.load('items/id,items/type,items/left,items/top,items/width,items/height'); return c; }); await ctx.sync();
    sl.items.forEach((x,i)=>shs[i].items.forEach(sh=>{ if(String(sh.type).toLowerCase()!=='image') return; if(sh.left<0||sh.width<45||sh.height<40||sh.top>SH*.86||sh.width/sh.height>7||sh.height/sh.width>7) return; list.push({slide:x.id,id:sh.id,left:sh.left,top:sh.top,width:sh.width,height:sh.height}); })); });
  let n=0, k=0;
  for(let i=0;i<list.length;i++){ const it=list[i]; msg(L('picBatch')+' '+(i+1)+'/'+list.length+'…');
    try{ let src=null; await PowerPoint.run(async ctx=>{ const sh=ctx.presentation.slides.getItem(it.slide).shapes.getItem(it.id), img=sh.getImageAsBase64({format:'Png'}); await ctx.sync(); src='data:image/png;base64,'+img.value; });
      const r=await pictureToShape(src,{id:it.id,left:it.left,top:it.top,width:it.width,height:it.height});
      const okShape=r&&(r.type==='solid'||r.type==='circle'||r.type==='poly'||(r.type==='lines'&&(((S.p.circles||[]).length&&S.p.pts.length+S.p.sides.length>=1)||S.p.sides.length>=2)));
      if(!okShape){ k++; setEdit(null); continue; }
      const pr=build(), bb=bboxPrims(pr), json=JSON.stringify({s:S,w:bb.w}); await insertNative(pr,json,bb,it.slide); n++; setEdit(null);
    }catch(e){ console.error(e); k++; setEdit(null); } }
  msg(L('picBatchDone').replace('{n}',n).replace('{k}',k),'good'); }
$('picSlideBtn').addEventListener('click',()=>convertPictures(false)); $('picAllBtn').addEventListener('click',()=>convertPictures(true));
$('picFile').addEventListener('change',()=>{ const f=$('picFile').files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>pictureToShape(rd.result,null); rd.readAsDataURL(f); });

/* ---------- التحديثات: نفس طريقة UULA Arabic Math ---------- */
(function(){
  const head=()=>fetch('app.html?chk='+Date.now(),{method:'HEAD',cache:'no-store'}).then(r=>r.ok?(r.headers.get('etag')||r.headers.get('last-modified')):null).catch(()=>null);
  let base=null, last=0;
  const check=async manual=>{ last=Date.now(); const t=await head();
    if(!base){ base=t; if(manual) msg(t?L('latest'):L('noConn')); return; }
    if(t&&t!==base){ $('updBtn').hidden=false; if(manual) msg(L('hasUpd')); }
    else if(manual) msg(t?L('latest'):L('noConn'),t?'good':'bad'); };
  head().then(t=>{ base=t; });
  setInterval(()=>check(false),60*60*1000);
  const soon=()=>{ if(Date.now()-last>60*60*1000) check(false); };
  addEventListener('focus',soon); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) soon(); });
  $('chkUpd').addEventListener('click',()=>check(true));
  $('updBtn').addEventListener('click',()=>{ save(); location.replace((location.pathname.split('/').pop()||'app.html')+'?v='+Date.now()); });
})();
